# numerical_models.toml - Write-time tolerance keys for oracle HDF5 attributes
# Gate verdicts come from those attributes, not from this file at compare time.
# Keys match numerical-models-design.md 6.3.
#
# Bounds are set by conditioning, not by taste. A kernel with kappa ~ 1e13
# cannot agree to 1e-12 in the solution vector, so the forward-error rows are
# loose and the backward-error (residual) rows are tight. That asymmetry is the
# measurement.

# --- Matrix ---

[tolerances."nmv.matrix.hilbert_solve.scipy"]
subject = "matrix"
operation = "Hilbert Solve Forward Error (n=10, kappa ~ 1.6e13)"
oracle_library = "scipy"
measure = "rel_l2"
bound = 5e-3

[tolerances."nmv.matrix.hilbert_residual.scipy"]
subject = "matrix"
operation = "Hilbert Solve Backward Residual"
oracle_library = "scipy"
measure = "abs"
bound = 1e-12

[tolerances."nmv.matrix.vandermonde_solve.scipy"]
subject = "matrix"
operation = "Vandermonde Runge Coefficients (n=8, equispaced)"
oracle_library = "scipy"
measure = "rel_l2"
bound = 1e-6

[tolerances."nmv.matrix.inverse_residual.scipy"]
subject = "matrix"
operation = "Explicit Hilbert Inverse Residual (n=8)"
oracle_library = "scipy"
measure = "abs"
bound = 1e-4

[tolerances."nmv.matrix.cholesky_spread.scipy"]
subject = "matrix"
operation = "Cholesky Solve, 1e10 Eigenvalue Spread"
oracle_library = "scipy"
measure = "rel_l2"
bound = 1e-6

[tolerances."nmv.matrix.qr_orthogonality.scipy"]
subject = "matrix"
operation = "QR Orthogonality Loss, Frobenius"
oracle_library = "scipy"
measure = "abs"
bound = 1e-12

