# Acceptance Criteria (Tolerance Table)
# Single Source of Truth matching classical-tools-examples-design.md §6.3

# --- DC Motor ---
[tolerances."dc_motor.plant.num"]
subject = "dc_motor"
operation = "Plant Numerator Polynomial"
oracle_library = "scipy"
measure = "abs"
bound = 1e-12

[tolerances."dc_motor.plant.den"]
subject = "dc_motor"
operation = "Plant Denominator Polynomial"
oracle_library = "scipy"
measure = "abs"
bound = 1e-12

[tolerances."dc_motor.margins.uncompensated.gain_crossover"]
subject = "dc_motor"
operation = "Uncompensated Gain Crossover"
oracle_library = "scipy"
measure = "abs"
bound = 5e-3

[tolerances."dc_motor.margins.uncompensated.phase_margin"]
subject = "dc_motor"
operation = "Uncompensated Phase Margin"
oracle_library = "scipy"
measure = "abs"
bound = 5e-3

[tolerances."dc_motor.compensator.gain_k"]
subject = "dc_motor"
operation = "Lead Gain K"
oracle_library = "scipy"
measure = "abs"
bound = 1e-4
independent = false

[tolerances."dc_motor.compensator.time_constant_t_s"]
