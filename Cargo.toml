[package]
name = "control-rs"
version = "0.0.0"
edition = "2024"
description = "A control systems library for autonomous systems."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dyse-Industries/control-rs.git"
categories = ["embedded", "science", "no-std"]
keywords = ["control", "robotics", "firmware", "autonomy"]

[workspace]
members = [
    ".",
    "control-rs-ets",
    "control-rs-xtask",
    "control-rs-macros",
]
default-members = ["."]

[workspace.lints.rust]
unused = "deny"
missing_docs = "deny"
rust_2018_idioms = "deny"

[workspace.lints.clippy]
todo = { level = "warn", priority = 1 }
inline_always = { level = "allow", priority = 1 }

all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
big_endian_bytes = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
empty_structs_with_brackets = "deny"
arbitrary_source_item_ordering = "deny"

[lints]
workspace = true

[dependencies]
libm = "0.2.16"
control-rs-macros = { path = "control-rs-macros", optional = true }
control-rs-ets = { path = "control-rs-ets", optional = true }

[features]
std = []
ets = ["dep:control-rs-macros", "dep:control-rs-ets"]

[dev-dependencies]
proptest = "1"

[profile.release]
# Enable Link Time Optimization (LTO)
lto = "fat" # or true for a simpler LTO, "fat" is more aggressive
# Set the optimization level to 3 (highest for speed)
opt-level = 3
# Set the number of code generation units to 1 for maximum inter-procedural optimization
codegen-units = 1
# Disable debug assertions
debug-assertions = false
