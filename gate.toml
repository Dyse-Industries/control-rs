# gate.toml - Continuous Integration & Quality-Gate Configuration
#
# Single source of truth for repository quality-gate orchestration.
# All configured items belong strictly to this workspace. Nested crates
# (examples/qemu, examples/teensy4, examples/subprograms/*) maintain their own
# independent configuration files.
#
# `[gates]` key order is the pipeline. Each value is skip | warn | fail
# (boolean true/false is still accepted as fail/skip).

[runner]
title = "control-rs"
out_dir = "target/ci"
timeout_secs = 90

[gates]
clean = "fail"
fmt = "fail"
clippy = "fail"
check = "fail"
deny = "fail"
audit = "fail"
build = "fail"
test = "fail"
coverage = "fail"

trace = "warn"

ets = "skip"
mutants = "skip"
miri = "skip"
valgrind = "skip"
lockbud = "skip"
fuzz = "skip"
kani = "skip"
