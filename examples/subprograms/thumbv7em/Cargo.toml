[package]
name = "thumbv7em-subprograms"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# After copying this crate, point `path` at your control-rs checkout.
control-rs = { path = "../../..", default-features = false }
libm = "0.2.16"
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "thumbv7em-subprograms"
path = "src/main.rs"
test = false

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
lto = true
