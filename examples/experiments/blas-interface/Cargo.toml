[package]
name = "blas-interface"
version = "0.1.0"
edition = "2024"
default-run = "blas-interface"
build = "build.rs"

# Standalone crate, deliberately not a member of the control-rs workspace
# (see the [lints] note below) — this empty table stops cargo from walking
# up and attaching to the root workspace anyway.
[workspace]

[lib]
name = "blas_interface"
# staticlib: no in-crate caller exists, so the no_mangle gemv_* symbols
# can't be inlined away — the measure binary disassembles this artifact
# directly. Unlike cdylib, staticlib needs no OS/dynamic linker, so it also
# builds for bare-metal (-none-) targets (no final link step happens for a
# staticlib, just "compile to object code, archive it").
crate-type = ["lib", "staticlib"]

[features]
default = ["std"]
# On: normal std-hosted build (src/main.rs correctness check). Off: no_std,
# for cross-compiling the staticlib to any target — see src/lib.rs.
std = []
# Builds and links csrc/gemv_c.c (see build.rs) and exposes gemv_c in
# src/lib.rs. Off by default: `measure`'s cross-target staticlib build must
# stay buildable without a C toolchain for every target, so the FFI variant
# is opt-in and host-only (see src/bin/c_call_cost.rs).
cffi = []

[[bin]]
name = "c_call_cost"
path = "src/bin/c_call_cost.rs"
required-features = ["cffi"]

[dependencies]

# Not `workspace = true`: this crate exists to compare raw codegen (bounds
# checks, pointer arithmetic, FFI-boundary shapes) across variants, which is
# exactly what the workspace's strict clippy/rustc lints forbid.

[profile.release]
# codegen-units=1 matches what `measure` already forces via `--config` for
# every cross-compiled target (see build_release_staticlib in
# src/bin/measure.rs) -- one codegen unit per crate, so LLVM optimizes the
# whole gemv_* body as a unit instead of splitting it across parallel
# codegen units, which can otherwise hide or shift where bounds checks land.
opt-level = 0
codegen-units = 1
