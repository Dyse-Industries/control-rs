[package]
name = "qemu"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0", default-features = false }
control-rs = { path = "../..", default-features = false, features = ["hil"] }
control-rs-hil = { path = "../../control-rs-hil" }
control-rs-macros = { path = "../../control-rs-macros" }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = "0.10"
riscv-rt = "0.12"
semihosting = { version = "0.1", features = ["stdio", "args"] }
riscv-semihosting = "0.1"

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.10"
riscv-rt = "0.12"
semihosting = { version = "0.1", features = ["stdio", "args"] }
riscv-semihosting = "0.1"

[[bin]]
name = "control-rs-qemu-thumbv7em-none-eabihf"
path = "src/thumbv7em-none-eabihf.rs"
test = false

[[bin]]
name = "control-rs-qemu-thumbv7em-none-eabi"
path = "src/thumbv7em-none-eabi.rs"
test = false

[[bin]]
name = "control-rs-qemu-riscv32imac-unknown-none-elf"
path = "src/riscv32imac-unknown-none-elf.rs"
test = false

[[bin]]
name = "control-rs-qemu-riscv64gc-unknown-none-elf"
path = "src/riscv64gc-unknown-none-elf.rs"
test = false

[workspace]

[profile.release]
panic = "abort"