[package]
name = "control-rs-numerical-model-examples"
version = "0.0.0"
edition = "2024"
publish = false
description = "Host numerical-model examples: suite validators, plots, and validate harness."
license = "MIT OR Apache-2.0"
default-run = "validate"
autobins = false

[workspace]

[dependencies]
control-rs = { path = "../.." }
libm = "0.2.16"
serde_json = "1.0.140"
aarch64-subprograms = { path = "../subprograms/aarch64", optional = true }

[features]
accelerate = ["dep:aarch64-subprograms", "aarch64-subprograms/accelerate"]

[[bin]]
name = "validate"
path = "src/main.rs"

[[bin]]
name = "matrix"
path = "src/matrix_validation.rs"

[[bin]]
name = "polynomial"
path = "src/polynomial_validation.rs"

[[bin]]
name = "state_space"
path = "src/state_space_validation.rs"

[[bin]]
name = "transfer_function"
path = "src/transfer_function_validation.rs"

[[bin]]
name = "tensor"
path = "src/tensor_validation.rs"