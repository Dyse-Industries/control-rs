[package]
name = "control-rs-numerical-model-examples"
version = "0.0.0"
edition = "2024"
publish = false
description = "Host numerical-model examples: suite validators, plots, and validate harness."
license = "MIT OR Apache-2.0"
default-run = "validate"
autobins = false

[workspace]

[dependencies]
control-rs = { path = "../.." }
libm = "0.2.16"
serde_json = "1.0.140"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"

[[bin]]
name = "matrix"
path = "src/bin/matrix.rs"

[[bin]]
name = "polynomial"
path = "src/bin/polynomial.rs"

[[bin]]
name = "state_space"
path = "src/bin/state_space.rs"

[[bin]]
name = "transfer_function"
path = "src/bin/transfer_function.rs"

[[bin]]
name = "tensor"
path = "src/bin/tensor.rs"
