[package]
name = "control-rs-numerical-model-examples"
version = "0.0.0"
edition = "2024"
publish = false
description = "Host numerical-model examples with JSON V&V artifacts."
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
control-rs = { path = "../.." }
libm = "0.2.16"
serde_json = "1.0.140"

[[bin]]
name = "tensor"
path = "examples/tensor.rs"

[[example]]
name = "all"
path = "examples/all.rs"

[[example]]
name = "matrix"
path = "examples/matrix.rs"

[[example]]
name = "matrix_demo"
path = "examples/matrix_example.rs"

[[example]]
name = "polynomial"
path = "examples/polynomial.rs"

[[example]]
name = "polynomial_demo"
path = "examples/polynomial_example.rs"

[[example]]
name = "state_space"
path = "examples/state_space.rs"

[[example]]
name = "state_space_demo"
path = "examples/state_space_example.rs"

[[example]]
name = "transfer_function"
path = "examples/transfer_function.rs"

[[example]]
name = "transfer_function_demo"
path = "examples/transfer_function_example.rs"

[[example]]
name = "tensor_demo"
path = "examples/tensor_example.rs"

[[example]]
name = "host_scale_emit"
path = "examples/host_scale_emit.rs"
