[package]
name = "teensy4"
version = "0.1.0"
edition = "2021"

[dependencies]
rtic = { version = "2", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "1", default-features = false, features = ["cortex-m-systick"] }
control-rs = { path = "../..", default-features = false, features = ["ets"] }
control-rs-ets = { path = "../../control-rs-ets" }
control-rs-macros = { path = "../../control-rs-macros" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
postcard = { version = "1.0", default-features = false }
usb-device = "0.2"
usbd-serial = "0.1"

# Remove these if you don't want logging.
imxrt-log = { version = "0.1", default-features = false, features = ["log", "usbd"] }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }

teensy4-panic = { version = "0.2", features = ["log"] }

[dependencies.teensy4-bsp]
version = "0.5"
features = [
    # Use the BSP's runtime.
    "rt",
]

# Don't optimize build dependencies, like proc macros.
# Helps with build times.
[profile.release.build-override]
opt-level = 0

[profile.dev]
opt-level = 1
panic = "abort"

[profile.release]
panic = "abort"

[workspace]


