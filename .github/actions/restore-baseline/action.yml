name: Restore baseline
description: >-
  Downloads the newest unexpired copy of a named artifact uploaded by a main
  branch run into a directory. The run's overall conclusion does not matter:
  baseline artifacts are uploaded only by jobs that passed, so one failing job
  elsewhere in a main run does not drop every baseline. A missing artifact
  leaves the gate without a baseline, which is not a failure.

inputs:
  name:
    description: Artifact name uploaded by the main branch run.
    required: true
  path:
    description: Directory the artifact contents are restored into.
    required: true

runs:
  using: composite
  steps:
    - name: Download ${{ inputs.name }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        DEST: ${{ inputs.path }}
      run: |
        mkdir -p "$DEST"
        run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
          --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")]
                | sort_by(.created_at) | last | .workflow_run.id // empty' 2>/dev/null || true)
        if [ -z "$run_id" ]; then
          echo "::notice::No unexpired $NAME artifact from main; no baseline."
          exit 0
        fi
        if gh run download "$run_id" --name "$NAME" --dir "$DEST"; then
          echo "Restored $NAME from run $run_id into $DEST"
        else
          echo "::notice::Could not download $NAME from run $run_id; no baseline."
        fi
