name: Numerical Model CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "examples/numerical-models/**"
      - "src/matrix/**"
      - "src/polynomial/**"
      - "src/state_space/**"
      - "src/transfer_function/**"
      - "src/tensor/**"
      - "src/math/**"
      - ".github/workflows/numerical-models.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "examples/numerical-models/**"
      - "src/matrix/**"
      - "src/polynomial/**"
      - "src/state_space/**"
      - "src/transfer_function/**"
      - "src/tensor/**"
      - "src/math/**"
      - ".github/workflows/numerical-models.yml"

jobs:
  Validator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: examples/numerical-models
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python oracles
        run: pip install -r python3/requirements.txt

      - name: Build example binaries
        run: cargo build --release

      - name: Validate suites
        run: cargo run --release --bin validate -- suites/

      - name: Upload results artifact
        id: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-models-results
          path: examples/numerical-models/results
          if-no-files-found: warn
          retention-days: 30

      - name: Publish plots to rolling release
        id: plots-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p plot-assets
          shopt -s nullglob
          for png in examples/numerical-models/results/*/*.png; do
            slug="$(basename "$(dirname "$png")")"
            name="$(basename "$png")"
            cp "$png" "plot-assets/${slug}-${name}"
          done
          assets=(plot-assets/*.png)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no PNGs under examples/numerical-models/results/"
            exit 1
          fi
          if ! gh release view plots >/dev/null 2>&1; then
            gh release create plots \
              --title "Numerical-model plots" \
              --notes "Rolling CI plots from numerical-models.yml. Not a crate version." \
              --latest=false
          fi
          gh release upload plots plot-assets/*.png --clobber

      - name: Results summary
        id: summary_generator # 1. Added an ID to reference later
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_URL: ${{ steps.results.outputs.artifact-url }}
          PLOTS_OUTCOME: ${{ steps.plots-release.outcome }}
          PLOTS_BASE: "https://github.com/${{ github.repository }}/releases/download/plots"
          PLOTS_TAG: "https://github.com/${{ github.repository }}/releases/tag/plots"
        run: |
          set -euo pipefail
          
          # 2. Generate a random EOF delimiter for safe multi-line output
          EOF=$(openssl rand -hex 8)
          echo "report_data<<$EOF" >> "$GITHUB_OUTPUT"
          
          {
            echo "## Numerical-model results"
            echo
            if [ -n "${ARTIFACT_URL:-}" ]; then
              echo "Download [numerical-models-results](${ARTIFACT_URL}) (\`results/<slug>/\` JSON + PNGs, 30-day retention)."
            else
              echo "No \`numerical-models-results\` artifact URL (missing \`results/\` or upload skipped)."
            fi
            echo
            echo "PNG pixels are not a numeric gate."
            echo
            echo "### Files"
            echo
            if [ -d examples/numerical-models/results ]; then
              find examples/numerical-models/results -type f | sort | sed 's/^/- `/' | sed 's/$/`/'
            else
              echo "_no results directory_"
            fi
            if [ "${PLOTS_OUTCOME:-}" = "success" ]; then
              echo
              echo "### Diagnostic plots"
              echo
              echo "Published to the rolling [\`plots\`](${PLOTS_TAG}) release."
              echo
              echo "#### Matrix"
              echo
              echo "![Hilbert inverse relative error](${PLOTS_BASE}/matrix-hilbert_inverse.png)"
              echo
              echo "![SE(3) rigid GEMM chain](${PLOTS_BASE}/matrix-se3_chain.png)"
              echo
              echo "#### Polynomial"
              echo
              echo "![Clustered-root Horner](${PLOTS_BASE}/polynomial-horner.png)"
              echo
              echo "![Companion heatmap](${PLOTS_BASE}/polynomial-companion.png)"
              echo
              echo "#### State space"
              echo
              echo "![Free-response phase portrait](${PLOTS_BASE}/state_space-free_response.png)"
              echo
              echo "![Stiff ZOH](${PLOTS_BASE}/state_space-stiff_zoh.png)"
              echo
              echo "#### Transfer function"
              echo
              echo "![Underdamped Bode](${PLOTS_BASE}/transfer_function-bode.png)"
              echo
              echo "![Nyquist complex pair](${PLOTS_BASE}/transfer_function-nyquist_complex_pair.png)"
              echo
              echo "#### Tensor"
              echo
              echo "![Saddle surface](${PLOTS_BASE}/tensor-curved_surface.png)"
              echo
              echo "![Saddle cut](${PLOTS_BASE}/tensor-curved_cut.png)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT" # 3. Tee sends the block to both targets
          
          # 4. Close the multi-line output block
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && matrix.rust == 'stable' && (success() || failure())
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          # 5. Changed `body-path` to `body` and referenced the exact ID and output name
          body: ${{ steps.summary_generator.outputs.report_data }}