name: Numerical Model CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "../../examples/numerical-models-validation/**"
      - "src/matrix/**"
      - "src/polynomial/**"
      - "src/state_space/**"
      - "src/transfer_function/**"
      - "src/tensor/**"
      - "src/math/**"
      - ".github/workflows/numerical-models.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "../../examples/numerical-models-validation/**"
      - "src/matrix/**"
      - "src/polynomial/**"
      - "src/state_space/**"
      - "src/transfer_function/**"
      - "src/tensor/**"
      - "src/math/**"
      - ".github/workflows/numerical-models.yml"

jobs:
  Validator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: examples/numerical-models-validation
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python oracles
        run: pip install -r python3/requirements.txt

      - name: Build example binaries
        run: cargo build --release

      - name: Validate suites
        run: cargo run --release

      - name: Generate Plots
        run: python3 python3/plot_models.py

      - name: Upload results artifact
        id: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-models-validation-results
          path: examples/numerical-models-validation/results
          if-no-files-found: warn
          retention-days: 30

      - name: Publish plots to rolling release
        id: plots-release
        # Removed the restriction to 'refs/heads/main'
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          
          # Sanitize the branch name (replace '/' with '-') to create a valid Git tag
          SAFE_BRANCH_NAME="${BRANCH_NAME//\//-}"
          RELEASE_TAG="plots-${SAFE_BRANCH_NAME}"
          
          mkdir -p plot-assets
          shopt -s nullglob
          for png in examples/numerical-models-validation/results/*.png; do
            slug="$(basename "$(dirname "$png")")"
            name="$(basename "$png")"
            cp "$png" "plot-assets/${slug}-${name}"
          done
          assets=(plot-assets/*.png)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no PNGs under examples/numerical-models/results/"
            exit 1
          fi
          
          # Check for and create the branch-specific release
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Numerical-model plots ($BRANCH_NAME)" \
              --notes "Rolling CI plots for branch ${BRANCH_NAME}." \
              --latest=false
          fi
          
          # Upload assets to the dynamic release tag
          gh release upload "$RELEASE_TAG" plot-assets/*.png --clobber
          
          # Export the tag name for downstream steps
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Results summary
        id: summary_generator # 1. Added an ID to reference later
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_URL: ${{ steps.results.outputs.artifact-url }}
          PLOTS_OUTCOME: ${{ steps.plots-release.outcome }}
          PLOTS_BASE: "https://github.com/${{ github.repository }}/releases/download/${{ steps.plots-release.outputs.release_tag }}"
          PLOTS_TAG: "https://github.com/${{ github.repository }}/releases/tag/${{ steps.plots-release.outputs.release_tag }}"
        run: |
          set -euo pipefail
          
          # 2. Generate a random EOF delimiter for safe multi-line output
          EOF=$(openssl rand -hex 8)
          echo "report_data<<$EOF" >> "$GITHUB_OUTPUT"
          
          {
          echo "## Numerical-model results"
          echo
          if [ -n "${ARTIFACT_URL:-}" ]; then
           echo "Download [numerical-models-results](${ARTIFACT_URL}) (\`results/<slug>/\` JSON + PNGs, 30-day retention)."
          else
           echo "No \`numerical-models-results\` artifact URL (missing \`results/\` or upload skipped)."
          fi
          echo
          echo "PNG pixels are not a numeric gate."
          echo
          echo "### Files"
          echo
          if [ -d examples/numerical-models-validation/results ]; then
           find examples/numerical-models-validation/results -type f | sort | sed 's/^/- `/' | sed 's/$/`/'
          else
           echo "_no results directory_"
          fi
          if [ "${PLOTS_OUTCOME:-}" = "success" ]; then
           echo
           echo "### Diagnostic plots"
           echo
           echo "Published to the rolling [\`plots\`](${PLOTS_TAG}) release."
           echo
           echo "![Matrix](${PLOTS_BASE}/matrix_details.png)"
           echo
           echo "![Polynomial](${PLOTS_BASE}/polynomial_details.png)"
           echo
           echo "![Free-response phase portrait](${PLOTS_BASE}/state_space-free_response.png)"
           echo
           echo "![State_space](${PLOTS_BASE}/state_space_details.png)"
           echo
           echo "![TF](${PLOTS_BASE}/transfer_function_details.png)"
           echo
           echo "![Tensor](${PLOTS_BASE}/tensor_details.png)"
          fi
          } | tee -a "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT" # 3. Tee sends the block to both targets
          
          # 4. Close the multi-line output block
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          # 5. Changed `body-path` to `body` and referenced the exact ID and output name
          body: ${{ steps.summary_generator.outputs.report_data }}