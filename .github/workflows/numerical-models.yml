name: Numerical Models V&V

on:
  push:
    branches: ["main"]
    paths:
      - "examples/numerical-models/**"
      - "src/matrix/**"
      - "src/polynomial/**"
      - "src/state_space/**"
      - "src/transfer_function/**"
      - "src/tensor/**"
      - "src/math/**"
      - ".github/workflows/numerical-models-vv.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "examples/numerical-models/**"
      - "src/matrix/**"
      - "src/polynomial/**"
      - "src/state_space/**"
      - "src/transfer_function/**"
      - "src/tensor/**"
      - "src/math/**"
      - ".github/workflows/numerical-models-vv.yml"

jobs:
  vv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/numerical-models
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python oracles
        run: pip install -r python3/requirements.txt

      - name: Python generators
        run: |
          for slug in matrix polynomial state_space transfer_function tensor; do
            python3 python3/${slug}.py
          done

      - name: Rust generators
        run: |
          for slug in matrix polynomial state_space transfer_function tensor; do
            cargo run --example ${slug}
          done

      - name: Equivalence tests
        run: cargo test
