name: Rust-CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'benches/**'
      - 'control-rs-verification/**'
      - 'control-rs-ets/**'
      - 'control-rs-ets-host/**'
      - 'control-rs-macros/**'
      - 'control-rs-tui/**'
      - 'control-rs-ci/**'
      - 'control-rs-compare/**'
      - 'documentation/**'
      - '.github/workflows/**'
      - '*.toml'
      - '.cargo/*.toml'
      - '.vale.ini'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'benches/**'
      - 'control-rs-verification/**'
      - 'control-rs-ets/**'
      - 'control-rs-ets-host/**'
      - 'control-rs-macros/**'
      - 'control-rs-tui/**'
      - 'control-rs-ci/**'
      - 'control-rs-compare/**'
      - 'documentation/**'
      - '.github/workflows/**'
      - '*.toml'
      - '.cargo/*.toml'
      - '.vale.ini'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Group: lint (fmt, clippy, vale)
  # ============================================================================
  lint:
    name: Lint & Prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Vale
        run: |
          curl -fsSL https://github.com/vale-cli/vale/releases/download/v3.22.0/vale_3.22.0_Linux_64-bit.tar.gz | tar -xz -C ~/.cargo/bin vale
          vale --config=.vale.ini sync

      - name: Run Lint Group
        run: cargo ci --verbose --group lint

      - name: Upload Lint Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-lint
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Group: build_test (build, test) across Rust matrix
  # ============================================================================
  build_test:
    name: Build & Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [ "stable", "1.89.0", "1.90.0", "1.91.0", "1.92.0", "1.93.0", "beta" ]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install Targets
        run: rustup target add thumbv7em-none-eabihf thumbv7em-none-eabi riscv32imac-unknown-none-elf riscv64gc-unknown-none-elf

      - name: Install apt packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev qemu-system

      - name: Run Build & Test Group
        run: cargo ci --verbose --group build_test

      - name: Upload Build Artifacts
        if: always() && matrix.rust == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-build_test
          path: target/ci-artifacts/
          retention-days: 7

      - name: Upload ETS Results Artifact
        if: always() && matrix.rust == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: ets-results-${{ matrix.rust }}
          path: ets-results.json
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================================
  # Group: audit (deny, semver, valgrind, geiger)
  # ============================================================================
  audit:
    name: Security & Memory Safety Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: cargo-bins/cargo-binstall@main
      - name: Install Audit Cargo Tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y cargo-deny cargo-geiger cargo-semver-checks

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run Audit Group
        run: cargo ci --verbose --group audit

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-audit
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Group: verify (cross-compare)
  # ============================================================================
  verify:
    name: Numerical Oracle Comparison
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Cross-Compare Baseline
        uses: ./.github/actions/restore-baseline
        with:
          name: baseline-cross-compare
          path: target/verification

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r control-rs-verification/python3/requirements.txt

      - name: Run Verify Group
        run: cargo ci --verbose --group verify

      - name: Upload Verify Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-verify
          path: target/ci-artifacts/
          retention-days: 7

      - name: Upload Cross-Compare Baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-cross-compare
          path: target/verification/cross-val-report.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # Group: coverage (coverage)
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: cargo-bins/cargo-binstall@main
      - name: Install Tarpaulin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y cargo-tarpaulin

      - name: Restore Coverage Baseline
        uses: ./.github/actions/restore-baseline
        with:
          name: baseline-coverage
          path: target/tarpaulin/tarpaulin

      - name: Run Coverage Group
        run: cargo ci --verbose --group coverage

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-coverage
          path: target/ci-artifacts/
          retention-days: 7

      - name: Upload Coverage Baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-coverage
          path: target/tarpaulin/tarpaulin/*-coverage.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # Exclusive Gate: regression (benchmarks & regression gate)
  # ============================================================================
  regression:
    name: Performance Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore Criterion Baseline
        uses: ./.github/actions/restore-baseline
        with:
          name: baseline-regression
          path: target/criterion

      - name: Run Regression Gate
        run: cargo ci --verbose --only regression

      - name: Upload Criterion Baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-regression
          path: target/criterion/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Regression Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-regression
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Exclusive Gates: mutants-* (mutation testing, one job per chunk)
  # ============================================================================
  # The matrix is every `mutants-*` gate in gate.toml. The gates partition the
  # root package by file, and the largest files split further with --shard.
  mutants-plan:
    name: Mutation Chunks
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.list.outputs.gates }}
    steps:
      - uses: actions/checkout@v4

      - name: List mutants-* gates
        id: list
        shell: python
        run: |
          import json, os, tomllib
          with open(".cargo/gate.toml", "rb") as f:
              gates = [name for name in tomllib.load(f) if name.startswith("mutants-")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("gates=" + json.dumps(gates) + "\n")

  mutants:
    name: Mutation Testing (${{ matrix.gate }})
    runs-on: ubuntu-latest
    needs: mutants-plan
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.mutants-plan.outputs.gates) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-mutants
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y cargo-mutants

      - name: Run Mutants Gate
        run: cargo ci --verbose --only ${{ matrix.gate }}

      - name: Upload Mutants Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.gate }}
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Aggregator: report (merges all group artifacts, writes ci-report.md, PR comment)
  # ============================================================================
  report:
    name: Aggregate Report
    runs-on: ubuntu-latest
    needs: [ lint, build_test, audit, verify, coverage, regression, mutants ]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download all group artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-artifacts-*
          path: target/ci-artifacts/
          merge-multiple: true

      - name: Generate CI Report
        run: cargo run --package control-rs-ci --bin report --

      - name: Build Documentation
        if: github.ref == 'refs/heads/main'
        run: cargo doc --no-deps --workspace

      - name: Upload Documentation Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc
          retention-days: 30

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: target/ci-artifacts/ci-report.md

      - name: Upload to Step Summary
        if: always()
        run: |
          if [ -f target/ci-artifacts/ci-report.md ]; then
            cat target/ci-artifacts/ci-report.md >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Publish: Release on Tag
  # ============================================================================
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: [ build_test, report ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Log in to crates.io
        run: cargo login "${{ secrets.CRATES_IO_TOKEN }}"
      - name: Publish workspace crates
        run: |
          cargo publish --package control-rs-macros || true
          cargo publish --package control-rs-ets || true
          cargo publish --package control-rs