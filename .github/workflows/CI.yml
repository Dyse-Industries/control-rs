name: Rust-CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'benches/**'
      - 'control-rs-verification/**'
      - 'control-rs-ets/**'
      - 'control-rs-ets-host/**'
      - 'control-rs-macros/**'
      - 'control-rs-tui/**'
      - 'control-rs-ci/**'
      - 'control-rs-compare/**'
      - 'documentation/**'
      - '.github/workflows/**'
      - '*.toml'
      - 'Cargo.lock'
      - '.cargo/*.toml'
      - '.cargo/clippy-allow-baseline.txt'
      - '.cargo/trace/**'
      - '.github/actions/**'
      - '.vale.ini'
      - '.vale/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'benches/**'
      - 'control-rs-verification/**'
      - 'control-rs-ets/**'
      - 'control-rs-ets-host/**'
      - 'control-rs-macros/**'
      - 'control-rs-tui/**'
      - 'control-rs-ci/**'
      - 'control-rs-compare/**'
      - 'documentation/**'
      - '.github/workflows/**'
      - '*.toml'
      - 'Cargo.lock'
      - '.cargo/*.toml'
      - '.cargo/clippy-allow-baseline.txt'
      - '.cargo/trace/**'
      - '.github/actions/**'
      - '.vale.ini'
      - '.vale/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Plain-text gate logs and ci-report.md: control-rs-ci passes this choice to
# every gate, and dtolnay/rust-toolchain keeps a value that is already set.
env:
  CARGO_TERM_COLOR: never

jobs:
  # ============================================================================
  # Stage pre (fetch) and group lint (fmt, clippy, allow-audit, doc, vale,
  # trace-reqs)
  # ============================================================================
  lint:
    name: Lint & Prose
    runs-on: ubuntu-latest
    steps:
      # Full history so allow-audit can read the baseline at origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Vale
        run: |
          curl -fsSL https://github.com/vale-cli/vale/releases/download/v3.22.0/vale_3.22.0_Linux_64-bit.tar.gz | tar -xz -C ~/.cargo/bin vale
          vale --config=.vale.ini sync

      # `pre` runs the `fetch` gate first; the full report requires its result.
      - name: Run Lint Group
        run: cargo --locked ci --verbose --group pre,lint

      - name: Upload Lint Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-lint
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Group: build_test (build, test) across Rust matrix
  # ============================================================================
  build_test:
    name: Build & Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [ "stable", "1.89.0", "1.95.0", "1.96.0", "1.97.0", "1.98.0", "beta" ]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run Build & Test Group
        run: cargo ci --verbose --group build_test

      - name: Upload Build Artifacts
        if: always() && matrix.rust == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-build_test
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Group: target (virtual-ets)
  # ============================================================================
  target:
    name: QEMU ETS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv7em-none-eabi, riscv32imac-unknown-none-elf, riscv64gc-unknown-none-elf

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc

      - name: Run Target Group
        run: cargo ci --verbose --group target

      - name: Upload Target Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-target
          path: target/ci-artifacts/
          retention-days: 30

  # ============================================================================
  # Groups: audit & valgrind (deny, semver, geiger, valgrind)
  # ============================================================================
  audit:
    name: Security & Memory Safety Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: cargo-bins/cargo-binstall@main
      - name: Install Audit Cargo Tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y cargo-deny cargo-geiger cargo-semver-checks

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run Audit and Valgrind Groups
        run: cargo ci --verbose --group audit,valgrind

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-audit
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Group: verify (cross-compare)
  # ============================================================================
  verify:
    name: Numerical Oracle Comparison
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Cross-Compare Baseline
        uses: ./.github/actions/restore-baseline
        with:
          name: baseline-cross-compare
          path: target/verification

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r control-rs-verification/python3/requirements.txt

      - name: Run Verify Group
        run: cargo ci --verbose --group verify

      - name: Upload Verify Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-verify
          path: target/ci-artifacts/
          retention-days: 7

      - name: Upload Cross-Compare Baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-cross-compare
          path: target/verification/cross-val-report.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # Group: coverage (coverage)
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: cargo-bins/cargo-binstall@main
      - name: Install Tarpaulin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y cargo-tarpaulin

      - name: Restore Coverage Baseline
        uses: ./.github/actions/restore-baseline
        with:
          name: baseline-coverage
          path: target/tarpaulin/tarpaulin

      - name: Run Coverage Group
        run: cargo ci --verbose --group coverage

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-coverage
          path: target/ci-artifacts/
          retention-days: 7

      - name: Upload Coverage Baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-coverage
          path: target/tarpaulin/tarpaulin/*-coverage.json
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # Post stage: kani (bounded model checking)
  # ============================================================================
  kani:
    name: Kani Formal Verification
    runs-on: ubuntu-latest
    needs: [ build_test ]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      - name: Run Kani Gate
        run: cargo ci --verbose --only kani

      - name: Upload Kani Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-kani
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Group: miri (undefined behavior analysis)
  # ============================================================================
  miri:
    name: Undefined Behavior Analysis (Miri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run Miri Group
        run: cargo ci --verbose --group miri

      - name: Upload Miri Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-miri
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Post stage: trace (requirement traceability check)
  # Needs lint (reqs.jsonl), build_test (test.log), and kani (kani.log).
  # ============================================================================
  trace:
    name: Requirement Traceability
    runs-on: ubuntu-latest
    needs: [ lint, build_test, kani ]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download lint artifacts
        uses: actions/download-artifact@v4
        with:
          name: ci-artifacts-lint
          path: target/ci-artifacts/

      - name: Download build_test artifacts
        uses: actions/download-artifact@v4
        with:
          name: ci-artifacts-build_test
          path: target/ci-artifacts/

      - name: Download kani artifacts
        if: needs.kani.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ci-artifacts-kani
          path: target/ci-artifacts/

      - name: Run Trace Gate
        run: cargo ci --verbose --only trace

      - name: Upload Trace Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-trace
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Post stage: regression (benchmarks & regression gate)
  # ============================================================================
  regression:
    name: Performance Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # Criterion compares against target/criterion/<id>/base, so the baseline
      # is benchmarked on this runner before the gate runs: timings from a
      # different machine shift every benchmark by more than the noise
      # threshold. A missing or failing baseline run leaves the gate without
      # one, which is not a failure.
      - name: Benchmark Baseline
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          else
            base="$BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::No baseline revision; benchmarks run without one."
            exit 0
          fi
          git worktree add ../baseline "$base"
          if (cd ../baseline && cargo bench); then
            mkdir -p target
            cp -R ../baseline/target/criterion target/criterion
          else
            echo "::notice::Baseline benchmarks failed at $base; no baseline."
          fi

      - name: Run Regression Gate
        run: cargo ci --verbose --only regression

      - name: Upload Regression Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-regression
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Post stage: mutants-* (mutation testing, one job per chunk)
  # ============================================================================
  # The matrix is every `mutants-*` gate in gate.toml. The gates partition the
  # root package by file, and the largest files split further with --shard.
  mutants-plan:
    name: Mutation Chunks
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.list.outputs.gates }}
    steps:
      - uses: actions/checkout@v4

      - name: List mutants-* gates
        id: list
        shell: python
        run: |
          import json, os, tomllib
          with open(".cargo/gate.toml", "rb") as f:
              gates = [name for name in tomllib.load(f) if name.startswith("mutants-")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("gates=" + json.dumps(gates) + "\n")

  mutants:
    name: Mutation Testing (${{ matrix.gate }})
    runs-on: ubuntu-latest
    needs: mutants-plan
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.mutants-plan.outputs.gates) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-mutants
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y cargo-mutants

      - name: Run Mutants Gate
        run: cargo ci --verbose --only ${{ matrix.gate }}

      - name: Upload Mutants Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.gate }}
          path: target/ci-artifacts/
          retention-days: 7

  # ============================================================================
  # Aggregator: report (merges all group artifacts, writes ci-report.md, PR comment)
  # ============================================================================
  report:
    name: Aggregate Report
    runs-on: ubuntu-latest
    needs: [ lint, build_test, target, audit, verify, coverage, regression, mutants, kani, miri, trace ]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download all group artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-artifacts-*
          path: target/ci-artifacts/
          merge-multiple: true

      - name: Generate CI Report
        if: always()
        run: cargo run --package control-rs-ci --bin report --

      - name: Build Documentation
        if: github.ref == 'refs/heads/main'
        run: cargo doc --no-deps --workspace

      - name: Upload Documentation Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc
          retention-days: 30

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: target/ci-artifacts/ci-report.md

      - name: Upload to Step Summary
        if: always()
        run: |
          if [ -f target/ci-artifacts/ci-report.md ]; then
            cat target/ci-artifacts/ci-report.md >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Publish: Release on Tag
  # ============================================================================
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: [ build_test, report ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        # Dependency order. A version already on crates.io is skipped (a
        # re-run after a partial publish); any other publish error fails the job.
        run: |
          set -euo pipefail
          for pkg in control-rs-macros control-rs-ets control-rs; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "control-rs-ci (github.com/Dyse-Industries/control-rs)" \
              "https://crates.io/api/v1/crates/$pkg/$version")
            if [ "$status" = "200" ]; then
              echo "::notice::$pkg $version is already published; skipping."
              continue
            fi
            cargo publish --locked --package "$pkg"
          done