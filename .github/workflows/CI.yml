name: Rust-CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post comments
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main

      - name: Install Tarpaulin
        run: cargo binstall cargo-tarpaulin@0.35.2 -y

      - name: Install Targets
        run: rustup target add thumbv7em-none-eabihf riscv32imac-unknown-none-elf

      - name: Install apt packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev qemu-system

      - name: Run CI
        run: cargo ci

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ci-report.md

      - name: Upload JSON coverage report
        uses: actions/upload-artifact@v4
        with:
          name: tarpaulin-json-report
          path: tarpaulin-report.json

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Log in to crates.io
        run: cargo login "${{ secrets.CRATES_IO_TOKEN }}"
      - name: Publish to crates.io
        run: cargo publish