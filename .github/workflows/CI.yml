name: Rust-CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'src/**'
      - 'control-rs-ets/**'
      - 'control-rs-ets-host/**'
      - 'control-rs-macros/**'
      - 'control-rs-tui/**'
      - 'control-rs-ci/**'
      - 'documentation/**'
      - '.github/workflows/**'
      - '*.toml'
      - '.vale.ini'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'control-rs-ets/**'
      - 'control-rs-ets-host/**'
      - 'control-rs-macros/**'
      - 'control-rs-tui/**'
      - 'control-rs-ci/**'
      - 'documentation/**'
      - '.github/workflows/**'
      - '*.toml'
      - '.vale.ini'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [ "stable", "1.89.0", "1.90.0", "1.91.0", "1.92.0", "1.93.0", "beta" ] # add nightly back when clippy is safe
    permissions:
      pull-requests: write # Required to post comments
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: cargo-bins/cargo-binstall@main
      - name: Install Cargo Tools
        run: cargo binstall -y cargo-tarpaulin cargo-deny cargo-geiger cargo-semver-checks

      - name: Install Vale
        run: |
          curl -fsSL https://github.com/vale-cli/vale/releases/download/v3.22.0/vale_3.22.0_Linux_64-bit.tar.gz | tar -xz -C ~/.cargo/bin vale
          vale --config=.vale.ini sync

      - name: Install Targets
        run: rustup target add thumbv7em-none-eabihf thumbv7em-none-eabi riscv32imac-unknown-none-elf riscv64gc-unknown-none-elf

      - name: Install apt packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev qemu-system valgrind

      - name: Download Tarpaulin Coverage Report
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/tarpaulin
          RUN_ID=$(gh run list --branch main --status success --workflow "Rust-CI" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            gh run download "$RUN_ID" \
              --name "tarpaulin-baseline-${{ matrix.rust }}" \
              --dir target/tarpaulin \
              || echo "No baseline coverage report found. Proceeding without diff."
          else
            echo "No baseline run found on main. Proceeding without diff."
          fi

      - name: Run CI
        run: cargo ci

      - name: Build Documentation
        run: cargo doc --no-deps --workspace

      - name: Upload Documentation Artifact
        if: github.ref == 'refs/heads/main' && matrix.rust == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc
          retention-days: 30

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && matrix.rust == 'stable' && (success() || failure())
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ci-report.md

      - name: Upload to Step Summary
        if: always()
        run: |
          if [ -f ci-report.md ]; then
            cat ci-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Tarpaulin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tarpaulin-baseline-${{ matrix.rust }}
          path: target/tarpaulin/*coverage.json
          retention-days: 30

      - name: Upload ETS Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ets-results-${{ matrix.rust }}
          path: ets-results.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Log in to crates.io
        run: cargo login "${{ secrets.CRATES_IO_TOKEN }}"
      - name: Publish to crates.io
        run: cargo publish