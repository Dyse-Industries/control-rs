[compare]
out_dir = "../results"
timeout_secs = 90

[[suite]]
name = "matrix"
true_oracle = "scipy"

[[suite.variants]]
name = "rust"
type = "rust_bin"
manifest_path = "Cargo.toml"
bin = "validate"
output_file = "../results/matrix.rust.h5"

[[suite.variants]]
name = "scipy"
type = "python_script"
script = "python3/matrix_oracle.py"
output_file = "../results/matrix.scipy.h5"

