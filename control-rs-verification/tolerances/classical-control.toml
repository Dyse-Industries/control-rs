# Cross-check tolerance table of `classical-control-design.md` §6.2.
# Keys are `<case>/<signal>` datasets of `classical_control.{rust,scipy}.h5`.
#
# output   : 1e-12 of the peak |y| of the SciPy sequence (lfilter, sosfilt).
# sections : 1e-9 of the peak source response; both sides are normalized
#            by that peak, so the bound is absolute.
# margins  : relative 1e-9 against brentq on L(jw).
# fixed    : the noise gain 0.5 * sum_s ||g_s||_1 = 4.54 quantization steps
#            (g_s: impulse response from the output rounding of section s to
#            the cascade output) against float64 sosfilt of the same
#            quantized coefficients, rounded up.

[tolerances."df2t_order1/output"]
method = "abs"
bound = 2.9e-12

[tolerances."df2t_order2/output"]
method = "abs"
bound = 1.2e-11

[tolerances."df2t_order3/output"]
