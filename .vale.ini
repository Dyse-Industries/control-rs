StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft, write-good
Vocab = ControlRs

[*.md]
BasedOnStyles = Vale, Microsoft, write-good
Vale.Terms = NO
Vale.Repetition = NO
TokenIgnores = (`[^`]+`), (https?://[^\s]+), (\$\$[\s\S]+?\$\$), (\$[^\$]+\$), (<!--[\s\S]*?-->), (<[^>]+>), (\b[a-zA-Z0-9]+_[a-zA-Z0-9_]+\b)

[*.rs]
BasedOnStyles = Vale, Microsoft, write-good
Vale.Terms = NO
Vale.Repetition = NO
TokenIgnores = (`[^`]+`), (https?://[^\s]+), (\$[^\$]+\$), (\b[a-zA-Z0-9]+_[a-zA-Z0-9_]+\b)
