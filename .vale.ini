StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft, write-good
Vocab = ControlRs

[*.md]
BasedOnStyles = Vale, Microsoft, write-good
Vale.Terms = NO
Vale.Repetition = NO

# Only disable rules that break code, math syntax, or established repo style standards
Microsoft.Negative = NO
Microsoft.Quotes = NO
Microsoft.Contractions = NO
Microsoft.Terms = NO
Microsoft.Avoid = NO
Microsoft.Dashes = NO
Microsoft.Spacing = NO
Microsoft.GenderBias = NO
Microsoft.Plurals = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.Adverbs = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Ellipses = NO

write-good.Passive = NO
write-good.TooWordy = NO
write-good.E-Prime = NO

TokenIgnores = (`[^`]+`), (https?://[^\s]+), (\$\$[\s\S]+?\$\$), (\$[^\$]+\$), (<!--[\s\S]*?-->), (</?[a-z][a-z0-9]*(?:\s[^<>\n]*)?/?>), (\b[a-zA-Z0-9]+_[a-zA-Z0-9_]+\b), (\bmultiply-[a-zA-Z0-9]+\b), ("[^"]+")

