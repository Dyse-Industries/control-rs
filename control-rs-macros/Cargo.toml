[package]
name = "control-rs-macros"
version = "0.1.0"
edition.workspace = true
description = "Procedural macros for the control-rs ETS test suite."
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["embedded", "control-systems", "ets", "testing"]
categories = ["embedded", "no-std"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.5", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"