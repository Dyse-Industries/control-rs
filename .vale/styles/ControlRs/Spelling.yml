extends: spelling
message: "Did you really mean '%s'?"
level: error
# Subscripted math symbols, snake_case identifiers, units, literals, and
# primitive types are names/quantities, not prose. Filters apply in every
# scope, including source comments, where TokenIgnores have no effect.
filters:
  - '[A-Za-z0-9]+_[A-Za-z0-9_]+'
  - '\b\d+(?:\.\d+)?\s*(?:ps|ns|us|µs|ms|s|Hz|kHz|MHz|GHz|rad/s|B|KB|MB|GB|KiB|MiB|GiB|deg|rad)\b'
  - '\b0x[0-9a-fA-F]+\b'
  - '\b0b[01]+\b'
  - '\b(?:[uif](?:8|16|32|64|128)|usize|isize)\b'
