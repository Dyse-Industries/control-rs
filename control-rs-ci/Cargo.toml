[package]
name = "control-rs-ci"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Repository quality-gate and on-target verification runner for control-rs workspaces."
readme = "README.md"
keywords = ["ci", "embedded", "testing", "ets"]
categories = ["development-tools::testing", "command-line-utilities"]
publish = false

[lints]
workspace = true

[dependencies]
anstream = "1.0"
anstyle = "1.0"
control-rs-ets-host = { path = "../control-rs-ets-host", version = "0.1.0" }
control-rs-ets = { path = "../control-rs-ets", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-hdf5 = "0.5.2"
regex = "1.10"
toml = "0.8"

[lib]
name = "control_rs_ci"
path = "src/lib.rs"

[[bin]]
name = "ci"
path = "src/main.rs"

[[bin]]
name = "gate"
path = "src/bin/gate.rs"

[[bin]]
name = "trace"
path = "src/bin/trace.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

