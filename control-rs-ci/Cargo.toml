[package]
name = "control-rs-ci"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Quality gate runner, artifact aggregator, and verification harness for control-rs."
readme = "README.md"
publish = false
keywords = ["control", "ci", "embedded", "testing"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[dependencies]
anstream = "0.6"
anstyle = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"

[[bin]]
name = "allow-audit"
path = "src/bin/allow-audit.rs"

[[bin]]
name = "control-rs-ci"
path = "src/bin/control-rs-ci.rs"

[[bin]]
name = "gate"
path = "src/bin/gate.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[[bin]]
name = "valgrind"
path = "src/bin/valgrind.rs"

[[bin]]
name = "regression"
path = "src/bin/regression.rs"

