[package]
name = "control-rs-trace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Requirement traceability: definition scanner and condition status checker for control-rs."
publish = false
keywords = ["control", "requirements", "traceability"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
anstream = "0.6"
control-rs-ci = { path = "..", version = "0.1.0" }
lexopt = "0.3"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[[bin]]
name = "trace-reqs"
path = "src/bin/trace-reqs.rs"

[[bin]]
name = "trace-check"
path = "src/bin/trace-check.rs"
