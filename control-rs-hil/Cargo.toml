[package]
name = "control-rs-hil"
version = "0.1.0"
edition = "2024"
description = "Hardware in the Loop (HIL) test suite for the control-rs project."
license = "MIT"
repository = "https://github.com/mdyson/control-rs"
readme = "README.md"
keywords = ["embedded", "control-systems", "hil", "testing"]
categories = ["embedded", "no-std"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0", default-features = false }
crc = { version = "3.4.0", default-features = false }

[dev-dependencies]
postcard = { version = "1.0", default-features = false, features = ["alloc"] }

[features]
default = ["stack-paint"]
stack-paint = []

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7"

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = "0.10"

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.10"