# cargo-deny policy for the control-rs workspace.
#
# Invoked as `cargo deny --all-features check`. The feature selection matters:
# a plain `cargo deny check` does not resolve the feature- and target-gated
# dependencies, so it silently skips the RISC-V and embedded edges of the
# published crates and reports a policy narrower than what they ship.

[advisories]
yanked = "deny"
ignore = [
    # bare-metal 0.2.5 is deprecated and is an unconditional dependency of
    # cortex-m 0.7.9, the latest release, so nothing available removes it.
    # Retire this entry when a cortex-m release without that edge ships.
    # Mirrored in `.cargo/audit.toml` for `cargo audit`.
    "RUSTSEC-2026-0110",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    # Encountered only in the feature- and target-gated graph, which the plain
    # `cargo deny check` invocation does not reach: riscv (ISC) on the RISC-V
    # targets, and a dependency carrying `AND Unicode-3.0`. Keeping them here
    # means the policy covers the whole dependency surface rather than only
    # the subset the gate's default feature selection resolves.
    "ISC",
    "Unicode-3.0",
]

[bans]
# Only the crates that ship are held to one version per dependency; see the
# `deny-duplicates` gate, which excludes the unpublished tooling crates. The
# entries below are the duplicates those crates cannot avoid.
multiple-versions = "deny"
skip = [
    # cortex-m 0.7.9 depends on embedded-hal 0.2 and 1.0, and riscv 0.10 on 0.2.
    { name = "embedded-hal", version = "<1", reason = "embedded-hal 0.2 and 1.0 coexist in the cortex-m and riscv crates" },
    # Procedural macros run on the host at build time and are not linked into
    # a shipped binary: control-rs-macros and cortex-m-macros use syn 2,
    # serde_derive uses syn 3.
    { name = "syn", version = "<3", reason = "build-time proc-macro dependency, not linked into binaries" },
]
wildcards = "deny"
# Path dependencies without a version are allowed: cargo strips versionless
# path dev-dependencies on publish, and `control-rs-ci` is `publish = false`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
