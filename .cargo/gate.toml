[runner]
title = "control-rs"
out_dir = "target/ci-artifacts"
timeout_secs = 90

# Added to the diff-trigger of every gate that declares its own; a gate without
# one always runs.
diff-trigger = [".cargo/gate.toml", ".cargo/config.toml", ".github/workflows/", "Cargo.toml", "Cargo.lock"]

[execution]
# Concurrent groups at once; the default is the number of declared groups.
# `--max-jobs <n>` overrides it for one invocation.
# max_jobs = 2

# Exclusive stages: the ONLY built-in stages in control-rs-ci. Their gates run
# one at a time on the calling thread, tagged [pre] or [post], each with full
# processor authority and the shared target directory.
#
# pre:  runs before any group starts. A failing pre gate aborts the run: no
#       group or post gate starts, and the report lists them as missing.
# post: runs after every group has joined (barrier join). Gates that require
#       full processor authority (benchmarks, mutation testing) belong here,
#       as does any gate listed in no group.
[execution.exclusive]
pre = ["fetch"]
post = [
    "trace",
    "regression",
    "mutants",
]

# Concurrent groups:
# Groups run on a worker pool of at most max_jobs threads and start in the
# order declared here. Gates within a group run sequentially in declared order.
# Output lines are tagged with the group name (for example [lint], [audit]).
# Each group builds into its own Cargo target directory, target/ci-groups/<group>,
# so concurrent groups never wait on a shared build-directory lock. A gate that
# sets CARGO_TARGET_DIR in its own env keeps that value. `cargo ci --clean`
# deletes target/ci-groups, so every group starts from an empty target directory.
[execution.groups]
build_test = ["build", "test"]
miri = ["miri"]
lint = ["fmt", "clippy", "allow-audit", "doc", "vale", "trace-reqs"]
audit = ["deny", "deny-duplicates", "semver", "geiger"]
valgrind = ["valgrind"]
verify = ["cross-compare"]
coverage = ["coverage"]
target = ["virtual-ets"]
kani = ["kani"]

# ==============================================================================
# Pre Stage Gates
# ==============================================================================

# Downloads every dependency once, before concurrent groups contend for the
# Cargo package cache and the network.
[fetch]
mode = "fail"
command = "cargo fetch"
args = ["--locked"]
timeout_secs = 600
description = "Downloads workspace dependencies into the Cargo cache before the groups start; fails if Cargo.lock is missing or out of date"

# ==============================================================================
# Cargo Lane Gates
# ==============================================================================

[fmt]
mode = "fail"
command = "cargo fmt"
args = ["--all", "--", "--check"]
diff-trigger = ["src/", "tests/", "benches/", "examples/", "control-rs-ci/", "control-rs-compare/", "control-rs-ets/", "control-rs-ets-host/", "control-rs-macros/", "control-rs-tui/", "control-rs-verification/", "rustfmt.toml"]
timeout_secs = 120
description = "Verifies codebase formatting conformity with rustfmt"

[clippy]
mode = "fail"
command = "cargo clippy"
args = ["--workspace", "--all-targets", "--", "-D", "warnings"]
diff-trigger = ["src/", "tests/", "benches/", "examples/", "control-rs-ci/", "control-rs-compare/", "control-rs-ets/", "control-rs-ets-host/", "control-rs-macros/", "control-rs-tui/", "control-rs-verification/", ".cargo/clippy.toml", ".cargo/clippy-allow-baseline.txt"]
timeout_secs = 900
description = "Executes Clippy linter across workspace targets"

[allow-audit]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "allow-audit", "--", "--baseline", ".cargo/clippy-allow-baseline.txt", "--base-ref", "origin/main"]
diff-trigger = ["src/", "tests/", "benches/", "examples/", "control-rs-ci/", "control-rs-compare/", "control-rs-ets/", "control-rs-ets-host/", "control-rs-macros/", "control-rs-tui/", "control-rs-verification/", ".cargo/clippy-allow-baseline.txt"]
timeout_secs = 900
description = "Fails on clippy suppression sites (allow, expect, cfg_attr, manifest allow level) beyond .cargo/clippy-allow-baseline.txt, on stale baseline entries, and on baseline growth against origin/main"

[doc]
mode = "fail"
command = "cargo doc"
args = ["--workspace", "--no-deps"]
env = { RUSTDOCFLAGS = "-D warnings" }
diff-trigger = ["src/", "tests/", "benches/", "examples/", "control-rs-ci/", "control-rs-compare/", "control-rs-ets/", "control-rs-ets-host/", "control-rs-macros/", "control-rs-tui/", "control-rs-verification/"]
timeout_secs = 900
description = "Builds workspace API documentation with rustdoc warnings denied"

[trace-reqs]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "trace-reqs", "--", "--config", ".cargo/trace/trace.toml", "--out", "target/ci-artifacts/reqs.jsonl"]
timeout_secs = 900
description = "Checks requirement definitions and verification conditions in the design documents that .cargo/trace/trace.toml lists and writes reqs.jsonl"

[build]
mode = "fail"
command = "cargo build"
args = ["--workspace", "--all-targets"]
timeout_secs = 1200
description = "Compiles all workspace targets"

[test]
mode = "fail"
command = "cargo test"
args = ["--workspace"]
timeout_secs = 1200
description = "Executes host unit and integration test suites"

# ==============================================================================
# Undefined Behavior Analysis Lane Gates (miri)
# ==============================================================================

[miri]
mode = "fail"
command = "cargo +nightly miri"
args = ["test", "-p", "control-rs", "--lib", "--"]
env = { MIRIFLAGS = "-Zmiri-disable-isolation", PROPTEST_DISABLE_FAILURE_PERSISTENCE = "1", PROPTEST_CASES = "8" }
timeout_secs = 600
description = "Executes library unit tests under Miri interpreter detecting undefined behavior and memory leaks"

[coverage]
mode = "fail"
command = "cargo tarpaulin"
args = ["--config", ".cargo/tarpaulin.toml", "--verbose", "--workspace", "--skip-clean", "--target-dir", "target/tarpaulin", "--color", "never", "--out", "Json", "--output-dir", "target/ci-artifacts"]
timeout_secs = 5400
description = "Measures workspace line coverage using cargo-tarpaulin"

# ==============================================================================
# Audit Lane Gates (vale: lint)
# ==============================================================================

[deny]
mode = "fail"
command = "cargo deny"
args = ["check", "advisories", "licenses", "sources"]
diff-trigger = [".cargo/deny.toml", "control-rs-ci/Cargo.toml", "control-rs-compare/Cargo.toml", "control-rs-ets/Cargo.toml", "control-rs-ets-host/Cargo.toml", "control-rs-macros/Cargo.toml", "control-rs-tui/Cargo.toml", "control-rs-verification/Cargo.toml"]
timeout_secs = 300
description = "Audits dependencies for security advisories, licenses and sources"

# Duplicate versions are held to one only for the crates that ship (the ones
# the publish job releases). The unpublished tooling crates and dev
# dependencies are left out.
[deny-duplicates]
mode = "fail"
command = "cargo deny"
args = [
    "--workspace",
    "--exclude", "control-rs-tui",
    "--exclude", "control-rs-ci",
    "--exclude", "control-rs-compare",
    "--exclude", "control-rs-ets-host",
    "--exclude", "control-rs-verification",
    "--exclude-dev",
    "--all-features",
    "check", "bans",
]
diff-trigger = [".cargo/deny.toml", "control-rs-ci/Cargo.toml", "control-rs-compare/Cargo.toml", "control-rs-ets/Cargo.toml", "control-rs-ets-host/Cargo.toml", "control-rs-macros/Cargo.toml", "control-rs-tui/Cargo.toml", "control-rs-verification/Cargo.toml"]
timeout_secs = 300
description = "Holds the crates that ship to one version per dependency"

[semver]
mode = "skip"
command = "cargo semver-checks"
args = ["check-release", "--baseline-rev", "origin/main"]
timeout_secs = 1200
description = "Verifies public API stability against baseline ref"

[vale]
mode = "fail"
command = "vale"
args = [
    "--config=.vale.ini",
    "--output=line",
    "documentation",
    "src",
    "control-rs-ets",
    "control-rs-macros",
    "control-rs-ets-host",
    "control-rs-tui",
    "control-rs-ci",
    "control-rs-compare",
    "control-rs-verification",
    "benches",
    "examples",
    "--glob=!**/target/**",
]
diff-trigger = ["documentation/", ".vale.ini", ".vale/", "src/", "tests/", "benches/", "examples/", "control-rs-ci/", "control-rs-compare/", "control-rs-ets/", "control-rs-ets-host/", "control-rs-macros/", "control-rs-tui/", "control-rs-verification/"]
timeout_secs = 300
description = "Lints documentation and doc comments for prose style conformity"

# ==============================================================================
# Target Lane Gates
# ==============================================================================

[virtual-ets]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "ets", "--", "--timeout", "120", "qemu", "all", "--release"]
diff-trigger = ["src/", "examples/qemu/", "control-rs-ets/", "control-rs-ets-host/", "control-rs-macros/", "control-rs-ci/"]
timeout_secs = 2400
description = "Builds QEMU ETS firmware and runs every suite headless on each target"

# ==============================================================================
# Audit and Verify Lane Gates (geiger and valgrind: audit; cross-compare: verify)
# ==============================================================================

[geiger]
mode = "fail"
command = "cargo geiger"
args = ["--output-format", "Json"]
env = { CARGO_TARGET_DIR = "target/geiger" }
diff-trigger = ["src/", "tests/", "benches/", "examples/", "control-rs-ci/", "control-rs-compare/", "control-rs-ets/", "control-rs-ets-host/", "control-rs-macros/", "control-rs-tui/", "control-rs-verification/"]
timeout_secs = 900
description = "Scans workspace crates for unsafe code blocks and functions"

[cross-compare]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-compare", "--bin", "compare", "--", "--config", ".cargo/compare.toml"]
env = { CARGO_TARGET_DIR = "target/cross-compare" }
diff-trigger = ["src/", "control-rs-compare/", "control-rs-verification/", ".cargo/compare.toml"]
timeout_secs = 1800
description = "Executes multi-language reference oracles and verifies HDF5 tolerance bounds"

# Fails without Valgrind (for example on macOS); skip it there with
# `cargo ci --skip valgrind`.
[valgrind]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "valgrind", "--", "--example", "dc_motor", "--example", "buck_converter", "--example", "fixed_point_math", "--example", "dsp_spectral_analysis"]
diff-trigger = ["src/", "examples/dc_motor.rs", "examples/buck_converter.rs", "examples/fixed_point_math.rs", "examples/dsp_spectral_analysis.rs", "control-rs-ci/"]
timeout_secs = 3600
description = "Executes Valgrind Memcheck against the listed workspace examples to verify zero memory leaks"

# ==============================================================================
# Post Stage Gates
# ==============================================================================

[kani]
mode = "fail"
command = "cargo kani"
args = ["-p", "control-rs", "--tests"]
timeout_secs = 600
description = "Executes bounded model checking over declared #[kani::proof] harnesses"

# Runs in the post exclusive stage after test and kani outputs are recorded.
[trace]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "trace-check", "--", "--config", ".cargo/trace/trace.toml", "--reqs", "target/ci-artifacts/reqs.jsonl", "--out", "target/ci-artifacts/trace-report.json", "--graph", "target/ci-artifacts/links.mmd"]
timeout_secs = 900
description = "Derives condition verification status from reqs and the libtest, kani, pytest and gtest result logs"

# Mutation testing over the whole workspace. The caller selects the scenario
# with passthrough arguments (`cargo gate --only mutants -- <args>`):
#   CI             --shard <k>/<n> --sharding round-robin
#                                          one slice of the whole mutant list
#   local          any `cargo mutants` option, or none for everything
#                  (`--in-diff <diff file>` limits a run to the changed code;
#                  it does not bound what a change affects, so CI does not use it)
# Exclusions live in .cargo/mutants.toml. CI runs this gate in one job event
# at a time, so the report does not require its result.
[mutants]
mode = "fail"
default = false
required = false
command = "cargo mutants"
args = ["--workspace", "--json", "--output", "target/ci-artifacts/mutants.out"]
diff-trigger = ["src/", "control-rs-ci/", "control-rs-compare/", "control-rs-ets/", "control-rs-ets-host/", "control-rs-macros/", "control-rs-tui/", ".cargo/mutants.toml"]
timeout_secs = 19800
description = "Mutation testing with cargo-mutants over the workspace"

[regression]
mode = "fail"
default = false
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "regression", "--", "--all", "--budgets", ".cargo/regression.toml"]
diff-trigger = ["src/", "benches/", ".cargo/regression.toml", "control-rs-ci/"]
timeout_secs = 7200
description = "Evaluates Criterion benchmark outputs against performance budgets and regression baselines"