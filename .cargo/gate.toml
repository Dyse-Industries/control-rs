[runner]
title = "control-rs"
out_dir = "target/ci-artifacts"
timeout_secs = 90

[execution]
# Concurrent groups at once; the default is the number of declared groups.
# `--max-jobs <n>` overrides it for one invocation.
# max_jobs = 2

# Exclusive stages: the ONLY built-in stages in control-rs-ci. Their gates run
# one at a time on the calling thread, tagged [pre] or [post], each with full
# processor authority and the shared target directory.
#
# pre:  runs before any group starts. A failing pre gate aborts the run: no
#       group or post gate starts, and the report lists them as missing.
# post: runs after every group has joined (barrier join). Gates that require
#       full processor authority (benchmarks, mutation testing) belong here,
#       as does any gate listed in no group.
[execution.exclusive]
pre = ["fetch"]
post = [
    "kani",
    "trace",
    "regression",
    "mutants",
    "mutants-storage-0",
    "mutants-storage-1",
    "mutants-storage-2",
    "mutants-storage-3",
    "mutants-storage-4",
    "mutants-subprograms-0",
    "mutants-subprograms-1",
    "mutants-subprograms-2",
    "mutants-subprograms-3",
    "mutants-math-0",
    "mutants-math-1",
    "mutants-matrix",
    "mutants-tensor",
    "mutants-tf-ss",
    "mutants-polynomial-0",
    "mutants-polynomial-1",
    "mutants-rest",
    "mutants-ci-0",
    "mutants-ci-1",
    "mutants-compare",
    "mutants-ets-host",
    "mutants-ets",
    "mutants-macros",
    "mutants-tui",
]

# Concurrent groups:
# Groups run on a worker pool of at most max_jobs threads and start in the
# order declared here. Gates within a group run sequentially in declared order.
# Output lines are tagged with the group name (for example [lint], [audit]).
# Each group builds into its own Cargo target directory, target/ci-groups/<group>,
# so concurrent groups never wait on a shared build-directory lock. A gate that
# sets CARGO_TARGET_DIR in its own env keeps that value. `cargo ci --clean`
# deletes target/ci-groups, so every group starts from an empty target directory.
[execution.groups]
build_test = ["build", "test"]
miri = ["miri"]
lint = ["fmt", "clippy", "allow-audit", "doc", "vale", "trace-reqs"]
audit = ["deny", "semver", "geiger"]
valgrind = ["valgrind"]
verify = ["cross-compare"]
coverage = ["coverage"]
target = ["virtual-ets"]

# ==============================================================================
# Pre Stage Gates
# ==============================================================================

# Downloads every dependency once, before concurrent groups contend for the
# Cargo package cache and the network.
[fetch]
mode = "fail"
command = "cargo fetch"
timeout_secs = 600
description = "Downloads workspace dependencies into the Cargo cache before the groups start"

# ==============================================================================
# Cargo Lane Gates
# ==============================================================================

[fmt]
mode = "fail"
command = "cargo fmt"
args = ["--all", "--", "--check"]
timeout_secs = 120
description = "Verifies codebase formatting conformity with rustfmt"

[clippy]
mode = "fail"
command = "cargo clippy"
args = ["--workspace", "--all-targets", "--", "-D", "warnings"]
timeout_secs = 900
description = "Executes Clippy linter across workspace targets"

[allow-audit]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "allow-audit", "--", "--baseline", ".cargo/clippy-allow-baseline.txt", "--base-ref", "origin/main"]
timeout_secs = 900
description = "Fails on clippy suppression sites (allow, expect, cfg_attr, manifest allow level) beyond .cargo/clippy-allow-baseline.txt, on stale baseline entries, and on baseline growth against origin/main"

[doc]
mode = "fail"
command = "cargo doc"
args = ["--workspace", "--no-deps"]
env = { RUSTDOCFLAGS = "-D warnings" }
timeout_secs = 900
description = "Builds workspace API documentation with rustdoc warnings denied"

[trace-reqs]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "trace-reqs", "--", "--config", ".cargo/trace/trace.toml", "--out", "target/ci-artifacts/reqs.jsonl"]
timeout_secs = 900
description = "Checks requirement definitions and verification conditions in the design documents that .cargo/trace/trace.toml lists and writes reqs.jsonl"

[build]
mode = "fail"
command = "cargo build"
args = ["--workspace", "--all-targets"]
timeout_secs = 1200
description = "Compiles all workspace targets"

[test]
mode = "fail"
command = "cargo test"
args = ["--workspace"]
timeout_secs = 1200
description = "Executes host unit and integration test suites"

# ==============================================================================
# Undefined Behavior Analysis Lane Gates (miri)
# ==============================================================================

[miri]
mode = "fail"
command = "cargo +nightly miri"
args = ["test", "-p", "control-rs", "--lib"]
env = { MIRIFLAGS = "-Zmiri-disable-isolation", PROPTEST_DISABLE_FAILURE_PERSISTENCE = "1", PROPTEST_CASES = "8" }
timeout_secs = 600
description = "Executes library unit tests under Miri interpreter detecting undefined behavior and memory leaks"

[coverage]
mode = "fail"
command = "cargo tarpaulin"
args = ["--config", ".cargo/tarpaulin.toml", "--verbose", "--workspace", "--skip-clean", "--target-dir", "target/tarpaulin", "--color", "never", "--out", "Json", "--output-dir", "target/ci-artifacts"]
timeout_secs = 5400
description = "Measures workspace line coverage using cargo-tarpaulin"

# ==============================================================================
# Audit Lane Gates (vale: lint)
# ==============================================================================

[deny]
mode = "fail"
command = "cargo deny"
args = ["check"]
timeout_secs = 300
description = "Audits dependencies for security advisories and license compliance"

[semver]
mode = "skip"
command = "cargo semver-checks"
args = ["check-release", "--baseline-rev", "origin/main"]
timeout_secs = 1200
description = "Verifies public API stability against baseline ref"

[vale]
mode = "fail"
command = "vale"
args = [
    "--config=.vale.ini",
    "--output=line",
    "documentation",
    "src",
    "control-rs-ets",
    "control-rs-macros",
    "control-rs-ets-host",
    "control-rs-tui",
    "control-rs-ci",
    "control-rs-compare",
    "control-rs-verification",
    "benches",
    "examples",
    "--glob=!**/target/**",
]
timeout_secs = 300
description = "Lints documentation and doc comments for prose style conformity"

# ==============================================================================
# Target Lane Gates
# ==============================================================================

[virtual-ets]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "ets", "--", "--timeout", "120", "qemu", "all", "--release"]
timeout_secs = 2400
description = "Builds QEMU ETS firmware and runs every suite headless on each target"

# ==============================================================================
# Audit and Verify Lane Gates (geiger and valgrind: audit; cross-compare: verify)
# ==============================================================================

[geiger]
mode = "fail"
command = "cargo geiger"
args = ["--output-format", "Json"]
env = { CARGO_TARGET_DIR = "target/geiger" }
timeout_secs = 900
description = "Scans workspace crates for unsafe code blocks and functions"

[cross-compare]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-compare", "--exclude-re", "replace > with >= in compute_chunk_stats", "--exclude-re", "replace < with <= in compare_float_arrays_parallel", "--exclude-re", "replace > with >= in execute_variant", "--bin", "compare", "--", "--config", ".cargo/compare.toml"]
env = { CARGO_TARGET_DIR = "target/cross-compare" }
timeout_secs = 1800
description = "Executes multi-language reference oracles and verifies HDF5 tolerance bounds"

# Fails without Valgrind (for example on macOS); skip it there with
# `cargo ci --skip valgrind`.
[valgrind]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "valgrind", "--", "--example", "dc_motor", "--example", "buck_converter", "--example", "fixed_point_math", "--example", "dsp_spectral_analysis"]
timeout_secs = 3600
description = "Executes Valgrind Memcheck against the listed workspace examples to verify zero memory leaks"

# ==============================================================================
# Post Stage Gates
# ==============================================================================

[kani]
mode = "fail"
command = "cargo kani"
args = ["-p", "control-rs", "--tests"]
timeout_secs = 600
description = "Executes bounded model checking over declared #[kani::proof] harnesses"

# Runs in the post exclusive stage after test and kani outputs are recorded.
[trace]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "trace-check", "--", "--config", ".cargo/trace/trace.toml", "--reqs", "target/ci-artifacts/reqs.jsonl", "--out", "target/ci-artifacts/trace-report.json"]
timeout_secs = 900
description = "Derives condition verification status from reqs and the libtest, kani, pytest and gtest result logs"

# Monolithic mutation testing: default = false (superseded in CI by the mutants-* chunks; run locally with `cargo gate mutants`).
[mutants]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--output", "target/ci-artifacts/mutants.out"]
timeout_secs = 43200
description = "Mutates ASTs to verify test fault-injection rigor using cargo-mutants"

# Mutation chunks. Each gate is one CI job: fail-closed, and outside an
# unfiltered `cargo ci` (`default = false`). The file filters partition the
# root package: every mutant belongs to exactly one gate, and mutants-rest
# claims any file outside the listed directories. Chunk sizes target at most
# about 400 mutants per gate (measured 2026-09-24, 4937 mutants in total).
# Chunks of one file share identical filter arguments, so `--shard k/n`
# partitions the same mutant list.

[mutants-storage-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "0/5", "--output", "target/ci-artifacts/mutants-storage-0.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 1 of 5"

[mutants-storage-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "1/5", "--output", "target/ci-artifacts/mutants-storage-1.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 2 of 5"

[mutants-storage-2]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "2/5", "--output", "target/ci-artifacts/mutants-storage-2.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 3 of 5"

[mutants-storage-3]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "3/5", "--output", "target/ci-artifacts/mutants-storage-3.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 4 of 5"

[mutants-storage-4]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "4/5", "--output", "target/ci-artifacts/mutants-storage-4.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 5 of 5"

[mutants-subprograms-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/subprograms.rs", "--shard", "0/4", "--output", "target/ci-artifacts/mutants-subprograms-0.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/subprograms.rs, chunk 1 of 4"

[mutants-subprograms-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/subprograms.rs", "--shard", "1/4", "--output", "target/ci-artifacts/mutants-subprograms-1.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/subprograms.rs, chunk 2 of 4"

[mutants-subprograms-2]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/subprograms.rs", "--shard", "2/4", "--output", "target/ci-artifacts/mutants-subprograms-2.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/subprograms.rs, chunk 3 of 4"

[mutants-subprograms-3]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/subprograms.rs", "--shard", "3/4", "--output", "target/ci-artifacts/mutants-subprograms-3.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/subprograms.rs, chunk 4 of 4"

[mutants-math-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/**", "-e", "src/math/storage.rs", "-e", "src/math/subprograms.rs", "--shard", "0/2", "--output", "target/ci-artifacts/mutants-math-0.out"]
timeout_secs = 19800
description = "Mutation testing: src/math except storage.rs and subprograms.rs, chunk 1 of 2"

[mutants-math-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/**", "-e", "src/math/storage.rs", "-e", "src/math/subprograms.rs", "--shard", "1/2", "--output", "target/ci-artifacts/mutants-math-1.out"]
timeout_secs = 19800
description = "Mutation testing: src/math except storage.rs and subprograms.rs, chunk 2 of 2"

[mutants-matrix]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/matrix/**", "--output", "target/ci-artifacts/mutants-matrix.out"]
timeout_secs = 19800
description = "Mutation testing: src/matrix"

[mutants-tensor]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/tensor/**", "--output", "target/ci-artifacts/mutants-tensor.out"]
timeout_secs = 19800
description = "Mutation testing: src/tensor"

[mutants-tf-ss]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/transfer_function/**", "-f", "src/state_space/**", "--output", "target/ci-artifacts/mutants-tf-ss.out"]
timeout_secs = 19800
description = "Mutation testing: src/transfer_function and src/state_space"

[mutants-polynomial-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/polynomial/**", "--shard", "0/2", "--output", "target/ci-artifacts/mutants-polynomial-0.out"]
timeout_secs = 19800
description = "Mutation testing: src/polynomial, chunk 1 of 2"

[mutants-polynomial-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/polynomial/**", "--shard", "1/2", "--output", "target/ci-artifacts/mutants-polynomial-1.out"]
timeout_secs = 19800
description = "Mutation testing: src/polynomial, chunk 2 of 2"

[mutants-rest]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-e", "src/math/**", "-e", "src/matrix/**", "-e", "src/tensor/**", "-e", "src/transfer_function/**", "-e", "src/state_space/**", "-e", "src/polynomial/**", "--output", "target/ci-artifacts/mutants-rest.out"]
timeout_secs = 19800
description = "Mutation testing: every file not claimed by another mutants-* gate"


# Workspace tool crates (measured 2026-09-24: ci 489, compare 202, ets-host 288,
# ets 180, macros 42, tui 113 mutants). `--no-config` drops .cargo/mutants.toml,
# whose `--lib` test filter and `src/**/tests/**` exclusion apply only to the
# root package: these crates keep their tests in `tests/` and inline modules.
# control-rs-verification is an oracle emitter validated by cross-compare and
# is not mutated.

# control-rs-ci exclusions (`--exclude-re`) are behaviorally equivalent mutants:
# `>=` where equality of two instants or byte counts cannot occur or changes
# nothing, `match guard ... with true` where the guarded arm is a no-op for
# other inputs, and the `cfg(not(unix))` `terminate_tree`, which is not
# compiled on the CI platform (excluded by its line, `gate.rs:605`; update it if the file shifts). The same list is on both shards so `--shard`
# partitions one mutant list.

[mutants-ci-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-ci", "--exclude-re", "with true in strip_string_literals", "--exclude-re", "replace > with >= in Gate::spawn_and_log", "--exclude-re", "replace < with <= in drain_pumps", "--exclude-re", "gate\\.rs:605:5: replace terminate_tree with \\(\\)", "--exclude-re", "replace > with >= in ReportAggregator::generate_markdown", "--shard", "0/2", "--output", "target/ci-artifacts/mutants-ci-0.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-ci, chunk 1 of 2"

[mutants-ci-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-ci", "--exclude-re", "with true in strip_string_literals", "--exclude-re", "replace > with >= in Gate::spawn_and_log", "--exclude-re", "replace < with <= in drain_pumps", "--exclude-re", "gate\\.rs:605:5: replace terminate_tree with \\(\\)", "--exclude-re", "replace > with >= in ReportAggregator::generate_markdown", "--shard", "1/2", "--output", "target/ci-artifacts/mutants-ci-1.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-ci, chunk 2 of 2"

# control-rs-compare exclusions are behaviorally equivalent mutants: `>=` where
# the comparison only decides whether to re-assign an equal maximum or whether
# two instants are equal, and `<=` at the chunk threshold, where one chunk gives
# the same result as the sequential path.

[mutants-compare]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-compare", "--output", "target/ci-artifacts/mutants-compare.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-compare"

[mutants-ets-host]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-ets-host", "--output", "target/ci-artifacts/mutants-ets-host.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-ets-host"

[mutants-ets]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-ets", "--output", "target/ci-artifacts/mutants-ets.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-ets"

[mutants-macros]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-macros", "--output", "target/ci-artifacts/mutants-macros.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-macros"

[mutants-tui]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-tui", "--output", "target/ci-artifacts/mutants-tui.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-tui"

[regression]
mode = "fail"
default = false
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "regression", "--", "--all", "--budgets", ".cargo/regression.toml"]
timeout_secs = 7200
description = "Evaluates Criterion benchmark outputs against performance budgets and regression baselines"
