[runner]
title = "control-rs"
out_dir = "target/ci-artifacts"
timeout_secs = 90

[execution]

# Built-in exclusive group:
# The ONLY built-in group in control-rs-ci. Gates listed here require Full Processor
# Authority (such as hardware target execution, benchmark validation, unsafe audits,
# or mutation testing) and must never compete for CPU, I/O, or target lock resources.
#
# The runner establishes a barrier join: ALL concurrent user groups must finish
# and join before exclusive gates run. Exclusive gates then execute
# strictly sequentially, one at a time, tagged [exclusive].
#
exclusive_gates = [
    "regression",
    "mutants",
    "mutants-storage-0",
    "mutants-storage-1",
    "mutants-storage-2",
    "mutants-storage-3",
    "mutants-storage-4",
    "mutants-subprograms-0",
    "mutants-subprograms-1",
    "mutants-subprograms-2",
    "mutants-subprograms-3",
    "mutants-math-0",
    "mutants-math-1",
    "mutants-matrix",
    "mutants-tensor",
    "mutants-tf-ss",
    "mutants-polynomial-0",
    "mutants-polynomial-1",
    "mutants-rest",
    "mutants-ci-0",
    "mutants-ci-1",
    "mutants-compare",
    "mutants-ets-host",
    "mutants-ets",
    "mutants-macros",
    "mutants-tui",
]

# User-defined execution groups:
# Each group executes concurrently on its own dedicated OS thread.
# Gates within a single group execute sequentially in declared order.
# Output lines are tagged with the group identifier (e.g., [cargo], [audit], [static]).
# Each group builds into its own Cargo target directory, target/ci-groups/<group>,
# so concurrent groups never wait on a shared build-directory lock. A gate that
# sets CARGO_TARGET_DIR in its own env keeps that value. `cargo ci --clean`
# deletes target/ci-groups, so every group starts from an empty target directory.
[execution.groups]
build_test = ["build", "test"]
lint = ["fmt", "clippy", "allow-audit", "vale", "doc"]
audit = ["deny", "semver", "valgrind", "geiger"]
verify = ["cross-compare"]
coverage = ["coverage"]
target = ["virtual-ets"]

# ==============================================================================
# Cargo Lane Gates
# ==============================================================================

[fmt]
mode = "fail"
command = "cargo fmt"
args = ["--all", "--", "--check"]
timeout_secs = 120
description = "Verifies codebase formatting conformity with rustfmt"

[clippy]
mode = "fail"
command = "cargo clippy"
args = ["--workspace", "--all-targets", "--", "-D", "warnings"]
timeout_secs = 900
description = "Executes Clippy linter across workspace targets"

[allow-audit]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "allow-audit", "--", "--baseline", ".cargo/clippy-allow-baseline.txt", "--base-ref", "origin/main"]
description = "Fails on clippy suppression sites (allow, expect, cfg_attr, manifest allow level) beyond .cargo/clippy-allow-baseline.txt, on stale baseline entries, and on baseline growth against origin/main"

[doc]
mode = "fail"
command = "cargo doc"
args = ["--workspace", "--no-deps"]
env = { RUSTDOCFLAGS = "-D warnings" }
timeout_secs = 900
description = "Builds workspace API documentation with rustdoc warnings denied"

[build]
mode = "fail"
command = "cargo build"
args = ["--workspace", "--all-targets"]
timeout_secs = 1200
description = "Compiles all workspace targets"

[test]
mode = "fail"
command = "cargo test"
args = ["--workspace"]
timeout_secs = 1200
description = "Executes host unit and integration test suites"

[coverage]
mode = "fail"
command = "cargo tarpaulin"
args = ["--config", ".cargo/tarpaulin.toml", "--verbose", "--workspace", "--skip-clean", "--target-dir", "target/tarpaulin", "--color", "never", "--out", "Json", "--output-dir", "target/ci-artifacts"]
timeout_secs = 5400
description = "Measures workspace line coverage using cargo-tarpaulin"

# ==============================================================================
# Audit Lane Gates
# ==============================================================================

[deny]
mode = "fail"
command = "cargo deny"
args = ["check"]
timeout_secs = 300
description = "Audits dependencies for security advisories and license compliance"

[semver]
mode = "fail"
command = "cargo semver-checks"
args = ["check-release", "--baseline-rev", "origin/main"]
timeout_secs = 1200
description = "Verifies public API stability against baseline ref"

[vale]
mode = "fail"
command = "vale"
args = [
    "--config=.vale.ini",
    "--output=line",
    "documentation",
    "src",
    "control-rs-ets",
    "control-rs-macros",
    "control-rs-ets-host",
    "control-rs-tui",
    "control-rs-ci",
    "control-rs-compare",
    "control-rs-verification",
    "tests",
    "benches",
    "examples",
    "--glob=!**/target/**",
]
timeout_secs = 300
description = "Lints documentation and doc comments for prose style conformity"

# ==============================================================================
# Target Lane Gates
# ==============================================================================

[virtual-ets]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "ets", "--", "--timeout", "120", "qemu", "all", "--release"]
timeout_secs = 2400
description = "Builds QEMU ETS firmware and runs every suite headless on each target"

# ==============================================================================
# Exclusive Lane Gates
# ==============================================================================

[geiger]
mode = "fail"
command = "cargo geiger"
args = ["--output-format", "Json"]
env = { CARGO_TARGET_DIR = "target/geiger" }
timeout_secs = 900
description = "Scans workspace crates for unsafe code blocks and functions"

[cross-compare]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-compare", "--bin", "compare", "--", "--config", ".cargo/compare.toml"]
env = { CARGO_TARGET_DIR = "target/cross-compare" }
timeout_secs = 1800
description = "Executes multi-language reference oracles and verifies HDF5 tolerance bounds"

[valgrind]
mode = "fail"
command = "cargo run"
args = ["--package", "control-rs-ci", "--bin", "valgrind"]
timeout_secs = 3600
skip_exit_codes = [78]
description = "Executes Valgrind Memcheck against all workspace example binaries to verify zero memory leaks"

[mutants]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--output", "target/ci-artifacts/mutants.out"]
timeout_secs = 43200
description = "Mutates ASTs to verify test fault-injection rigor using cargo-mutants"

# Mutation chunks. Each gate is one CI job: fail-closed, and outside an
# unfiltered `cargo ci` (`default = false`). The file filters partition the
# root package: every mutant belongs to exactly one gate, and mutants-rest
# claims any file outside the listed directories. Chunk sizes target at most
# about 400 mutants per gate (measured 2026-09-24, 4937 mutants in total).
# Chunks of one file share identical filter arguments, so `--shard k/n`
# partitions the same mutant list.

[mutants-storage-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "0/5", "--output", "target/ci-artifacts/mutants-storage-0.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 1 of 5"

[mutants-storage-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "1/5", "--output", "target/ci-artifacts/mutants-storage-1.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 2 of 5"

[mutants-storage-2]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "2/5", "--output", "target/ci-artifacts/mutants-storage-2.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 3 of 5"

[mutants-storage-3]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "3/5", "--output", "target/ci-artifacts/mutants-storage-3.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 4 of 5"

[mutants-storage-4]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/storage.rs", "--shard", "4/5", "--output", "target/ci-artifacts/mutants-storage-4.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/storage.rs, chunk 5 of 5"

[mutants-subprograms-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/subprograms.rs", "--shard", "0/4", "--output", "target/ci-artifacts/mutants-subprograms-0.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/subprograms.rs, chunk 1 of 4"

[mutants-subprograms-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/subprograms.rs", "--shard", "1/4", "--output", "target/ci-artifacts/mutants-subprograms-1.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/subprograms.rs, chunk 2 of 4"

[mutants-subprograms-2]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/subprograms.rs", "--shard", "2/4", "--output", "target/ci-artifacts/mutants-subprograms-2.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/subprograms.rs, chunk 3 of 4"

[mutants-subprograms-3]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/subprograms.rs", "--shard", "3/4", "--output", "target/ci-artifacts/mutants-subprograms-3.out"]
timeout_secs = 19800
description = "Mutation testing: src/math/subprograms.rs, chunk 4 of 4"

[mutants-math-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/**", "-e", "src/math/storage.rs", "-e", "src/math/subprograms.rs", "--shard", "0/2", "--output", "target/ci-artifacts/mutants-math-0.out"]
timeout_secs = 19800
description = "Mutation testing: src/math except storage.rs and subprograms.rs, chunk 1 of 2"

[mutants-math-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/math/**", "-e", "src/math/storage.rs", "-e", "src/math/subprograms.rs", "--shard", "1/2", "--output", "target/ci-artifacts/mutants-math-1.out"]
timeout_secs = 19800
description = "Mutation testing: src/math except storage.rs and subprograms.rs, chunk 2 of 2"

[mutants-matrix]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/matrix/**", "--output", "target/ci-artifacts/mutants-matrix.out"]
timeout_secs = 19800
description = "Mutation testing: src/matrix"

[mutants-tensor]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/tensor/**", "--output", "target/ci-artifacts/mutants-tensor.out"]
timeout_secs = 19800
description = "Mutation testing: src/tensor"

[mutants-tf-ss]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/transfer_function/**", "-f", "src/state_space/**", "--output", "target/ci-artifacts/mutants-tf-ss.out"]
timeout_secs = 19800
description = "Mutation testing: src/transfer_function and src/state_space"

[mutants-polynomial-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/polynomial/**", "--shard", "0/2", "--output", "target/ci-artifacts/mutants-polynomial-0.out"]
timeout_secs = 19800
description = "Mutation testing: src/polynomial, chunk 1 of 2"

[mutants-polynomial-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-f", "src/polynomial/**", "--shard", "1/2", "--output", "target/ci-artifacts/mutants-polynomial-1.out"]
timeout_secs = 19800
description = "Mutation testing: src/polynomial, chunk 2 of 2"

[mutants-rest]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "-e", "src/math/**", "-e", "src/matrix/**", "-e", "src/tensor/**", "-e", "src/transfer_function/**", "-e", "src/state_space/**", "-e", "src/polynomial/**", "--output", "target/ci-artifacts/mutants-rest.out"]
timeout_secs = 19800
description = "Mutation testing: every file not claimed by another mutants-* gate"


# Workspace tool crates (measured 2026-09-24: ci 489, compare 202, ets-host 288,
# ets 180, macros 42, tui 113 mutants). `--no-config` drops .cargo/mutants.toml,
# whose `--lib` test filter and `src/**/tests/**` exclusion apply only to the
# root package: these crates keep their tests in `tests/` and inline modules.
# control-rs-verification is an oracle emitter validated by cross-compare and
# is not mutated.

[mutants-ci-0]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-ci", "--shard", "0/2", "--output", "target/ci-artifacts/mutants-ci-0.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-ci, chunk 1 of 2"

[mutants-ci-1]
mode = "fail"
default = false
command = "cargo mutants"
args = ["--json", "--no-config", "--package", "control-rs-ci", "--shard", "1/2", "--output", "target/ci-artifacts/mutants-ci-1.out"]
timeout_secs = 19800
description = "Mutation testing: control-rs-ci, chunk 2 of 2"

