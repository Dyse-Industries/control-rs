# --- Complexity & Safety Limits ---
# Lowered from 8. Large argument lists often lead to stack bloat and call-site confusion.
too-many-arguments-threshold = 4

# Drastically lowered from 256. Complex types (like nested generics for
# hardware abstraction layers) should be aliased for readability and to prevent logic errors.
type-complexity-threshold = 50

# Limit the number of lines in a function to encourage modular, testable units.
too-many-lines-threshold = 60

# Duplicate versions we do not control:
# `postcard` 1.1 depends on both `embedded-io` 0.4 and 0.6;
# `nb` 0.1.3 is a compatibility re-export of `nb` 1.1 (`embedded-hal` 0.2);
# `rustc_version` 0.2 vs 0.4 (and `semver` 0.9 vs 1) come from `cortex-m`/`bare-metal`
# vs `heapless` build-dependencies;
# `cortex-m` depends on `embedded-hal` 0.2 directly and 1.0 via `riscv`;
# `ratatui` 0.30 resolves `hashbrown` 0.16 (via `kasuari`) beside 0.17 and
# `syn` 3 (via `instability`/`darling`) beside 2, and its `termwiz` backend
# graph brings `bitflags` 1, `syn` 1, `thiserror` 1 and `getrandom` 0.3
# (with `r-efi` 5) beside the current majors.
allowed-duplicate-crates = [
    "embedded-io", "nb", "rustc_version", "semver", "embedded-hal",
    "bitflags", "getrandom", "hashbrown", "r-efi", "syn", "thiserror",
    "thiserror-impl",
]

# --- Safety-Critical Specifics ---

# Tests should always be safe to fail.
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true

# Ensure doc comments are present for all public items.
missing-docs-in-crate-items = true

# --- Item Ordering & Architecture ---

# 1. Strict Item Grouping
# Logical flow is prioritized: Imports -> Types -> Implementation -> Logic.
# Aliases, enums, structs and traits share one PascalCase group so related
# items can stay together (e.g. an error enum next to its Result alias).
module-item-order-groupings = [
    ["extern_crates", ["extern_crate"]],
    ["use", ["use"]],
    ["modules", ["foreign_mod", "mod"]],
    ["global_asm", ["global_asm"]],
    ["UPPER_SNAKE_CASE", ["static", "const"]],
    ["PascalCase", ["ty_alias", "enum", "struct", "union", "trait", "trait_alias"]],
    ["macros", ["macro"]],
    ["impls", ["impl"]],
    ["lower_snake_case", ["fn"]]
]

# 2. Scope of ordering
# Module-level grouping only (see module-item-order-groupings). Do not
# alphabetize enum variants, struct fields, trait items, or impl items:
# those orders are layout-, ABI-, or documentation-significant.
source-item-ordering = ["module"]

# 3. Trait associated-item kind order (const, then type, then fn) is a
# convention, not a lint, unless "trait" is added to source-item-ordering.
trait-assoc-item-kinds-order = ["const", "type", "fn"]

# 4. Sorting within groupings
module-items-ordered-within-groupings = ["use", "UPPER_SNAKE_CASE", "modules"]