# Test suites under src/**/tests/ compile into the library for on-target
# execution, so cargo-mutants does not recognize them as test code. Mutating
# them measures nothing.
exclude_globs = ["src/**/tests/**", "tests/**", "benches/**"]

# Doc-tests are expensive and should not be relied on to catch mutants.
# This allows speeding up the test command run for each mutant.
additional_cargo_test_args = ["--lib"]

# Behaviorally equivalent mutants (no test can distinguish them):
# - Bit reversal is an involution, so swapping when `i < j`, `i > j`, or
#   `i <= j` (the extra `i == j` swap is a no-op) yields the same permutation.
# - Absolute value via `x < 0` versus `x <= 0`: at zero both give zero.
exclude_re = [
    "replace < with (>|<=) in FFT::fft_complex",
    "replace < with <= in <impl level1::(Asum|Iamax)<",
    # Aberth iteration bookkeeping: `>=` re-assigns an equal value and the
    # convergence test only decides when to stop refining an already
    # converged iterate.
    "replace > with >= in Polynomial<T, Const<N>, S>::aberth_(initial_seeds|solver)",
    "replace < with (==|<=) in Polynomial<T, Const<N>, S>::aberth_solver",
    # The sum over all hypercube corners does not depend on which bit of the
    # corner mask selects the upper vertex; swapping it permutes the terms.
    "replace != with == in Tensor<T, L, B>::interpolate",
    # A strictly larger running maximum or a tie leaves the same value.
    "replace > with >= in Matrix<T, Const<N>, Const<N>, S>::inf_norm",
    # Scaling and squaring: a norm exactly at the threshold, extra halvings
    # (each exact) and a 17th halving past an already-saturated count leave
    # the result within rounding of the same exponential.
    "replace > with >= in Owned<T, N, N>::expm",
    "replace && with \\|\\| in Owned<T, N, N>::expm",
    "replace < with <= in Owned<T, N, N>::expm",
    # `COO` buffers reject out-of-range coordinates on `push`, so the
    # conversions revalidate a state that cannot occur.
    "replace \\|\\| with && in Array(Csr|Csc)Storage<T, R, C, MAX_NNZ, (R1|C1)>::from_coo",
    # A zero stride contributes zero to both the lower and the upper bound.
    "replace > with >= in strided_window_fits",
    # Equal off-diagonal magnitudes: either pivot is a valid Jacobi choice and
    # the spectrum is the same.
    "replace > with >= in ev_max_offdiag",
    # Interpolation clamps to the grid: past an edge both corners are the
    # same cell and the two weights sum to one, so `>=` and `==` on the upper
    # clamp, `<=` on the lower clamp and `<=` on the cell search (which stops
    # at the last cell either way) return the same value.
    "replace < with <= in Tensor<T, L, B>::interpolate",
    "replace > with (==|>=) in Tensor<T, L, B>::interpolate",
    # The loop only skips the matrix update after the last coefficient, which
    # nothing reads; performing it too changes no result.
    "replace < with <= in StateSpace<T, NX, 1, 1>::to_transfer_function",
    # Kani harnesses compile only under `cfg(kani)`; the `kani` gate checks
    # them, and no unit test can reach them.
    "proofs::prove_",
]
