# cargo-mutants configuration for the control-rs workspace.
# Kill mutants with library unit tests (`cargo test --lib`), not host
# validation binaries. Options here are the native cargo-mutants schema;
# `cargo mutants` with no extra flags is the CI invocation.
#
# Test files are excluded: mutating test helpers tests whether the test
# catches itself, not whether the library code is tested. This removes
# ~18% of all generated mutants with zero coverage loss.

additional_cargo_test_args = ["--lib"]
timeout_multiplier = 2.0
exclude_re = [
    "impl Debug",
    "impl Display",
    "/tests/",
    "_tests\\.rs",
    "_test\\.rs",
]
