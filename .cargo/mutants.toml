# Test suites under src/**/tests/ compile into the library for on-target
# execution, so cargo-mutants does not recognize them as test code. Mutating
# them measures nothing. control-rs-verification is an oracle emitter validated
# by cross-compare and is not mutated.
exclude_globs = ["src/**/tests/**", "tests/**", "benches/**", "control-rs-verification/**"]

# Doc-tests are expensive and should not be relied on to catch mutants. Library,
# binary and integration tests run for each mutant: the workspace tool crates
# keep their tests in `tests/` and inline modules.
additional_cargo_test_args = ["--tests"]

# Behaviorally equivalent mutants (no test can distinguish them):
# - Bit reversal is an involution, so swapping when `i < j`, `i > j`, or
#   `i <= j` (the extra `i == j` swap is a no-op) yields the same permutation.
# - Absolute value via `x < 0` versus `x <= 0`: at zero both give zero.
exclude_re = [
    "replace < with (>|<=) in FFT::fft_complex",
    "replace < with <= in <impl level1::(Asum|Iamax)<",
    # Aberth iteration bookkeeping: `>=` re-assigns an equal value and the
    # convergence test only decides when to stop refining an already
    # converged iterate.
    "replace > with >= in Polynomial<T, Const<N>, S>::aberth_(initial_seeds|solver)",
    "replace < with (==|<=) in Polynomial<T, Const<N>, S>::aberth_solver",
    # The sum over all hypercube corners does not depend on which bit of the
    # corner mask selects the upper vertex; swapping it permutes the terms.
    "replace != with == in Tensor<T, L, B>::interpolate",
    # A strictly larger running maximum or a tie leaves the same value.
    "replace > with >= in Matrix<T, Const<N>, Const<N>, S>::inf_norm",
    # Scaling and squaring: a norm exactly at the threshold, extra halvings
    # (each exact) and a 17th halving past an already-saturated count leave
    # the result within rounding of the same exponential.
    "replace > with >= in Owned<T, N, N>::expm",
    "replace && with \\|\\| in Owned<T, N, N>::expm",
    "replace < with <= in Owned<T, N, N>::expm",
    # `COO` buffers reject out-of-range coordinates on `push`, so the
    # conversions revalidate a state that cannot occur.
    "replace \\|\\| with && in Array(Csr|Csc)Storage<T, R, C, MAX_NNZ, (R1|C1)>::from_coo",
    # A zero stride contributes zero to both the lower and the upper bound.
    "replace > with >= in strided_window_fits",
    # Equal off-diagonal magnitudes: either pivot is a valid Jacobi choice and
    # the spectrum is the same.
    "replace > with >= in ev_max_offdiag",
    # Interpolation clamps to the grid: past an edge both corners are the
    # same cell and the two weights sum to one, so `>=` and `==` on the upper
    # clamp, `<=` on the lower clamp and `<=` on the cell search (which stops
    # at the last cell either way) return the same value.
    "replace < with <= in Tensor<T, L, B>::interpolate",
    "replace > with (==|>=) in Tensor<T, L, B>::interpolate",
    # The loop only skips the matrix update after the last coefficient, which
    # nothing reads; performing it too changes no result.
    "replace < with <= in StateSpace<T, NX, 1, 1>::to_transfer_function",
    # Test modules compiled into the library for on-target execution
    # (`cfg(any(test, feature = "ets"))`) are not recognized as test code.
    "tests::",
    # The test constant `U = f64::EPSILON / 2.0` (realization.rs, column 33)
    # has no enclosing function, so its mutants carry no `tests::` name. `%`
    # and `*` only enlarge `U`, which is the upper bound in the error
    # assertions: a looser bound cannot fail a passing test. The `$` anchor
    # excludes every mutant that names a function, `quantize` among them.
    "realization\\.rs:\\d+:33: replace / with [%*]$",
    # Boundary cases whose result is identical, pinned by column so a new
    # comparison on the same line or function is not hidden:
    # - A tie in the running minimum or maximum re-assigns the same value.
    "margins\\.rs:\\d+:49: replace < with <= in sweep",
    "step\\.rs:\\d+:23: replace > with >= in peak_of",
    "nyquist\\.rs:\\d+:(18|24): replace > with >= in indent",
    # - A zero excess scales to zero, and a unit magnitude equals the floor.
    "step\\.rs:\\d+:30: replace > with >= in step_info",
    "realization\\.rs:\\d+:24: replace > with >= in is_real",
    # - Output equal to a limit is the limit.
    "pid\\.rs:\\d+:(26|23): replace [<>] with [<>]= in Pid<T>::step",
    # - A zero error integrates to zero either way.
    "pid\\.rs:\\d+:(28|58): replace (>|<) with (>=|<=) in Pid<T>::integrator_step",
    # - The insertion sort loop test `pos > 0` with `>=`: at `pos = 0` the
    #   index `pos - 1` saturates to 0, the element compares against itself
    #   and the strict `>` guard breaks before any swap.
    "realization\\.rs:\\d+:19: replace > with >= in sort_by_magnitude_desc",
    # - Clamping the closest-point parameter at 0 or 1 is idempotent: at the
    #   boundary both branches yield the same point, so no test can tell
    #   `<` from `<=` (and `>` from `>=`).
    "nyquist\\.rs:\\d+:14: replace < with <= in clear_of_origin",
    "nyquist\\.rs:\\d+:21: replace > with >= in clear_of_origin",
    # - Negating a zero magnitude yields zero.
    "realization\\.rs:\\d+:27: replace < with <= in is_stable",
    "math/fixed_num\\.rs:\\d+:10: replace < with <= in round_shift_signed",
    # - The Routh leading coefficient is nonzero past the `tol` guard, and the
    #   first element of a row is replaced when zero.
    "routh\\.rs:\\d+:(37|62): replace < with <= in routh_count",
    # Kani harnesses and their helpers compile only under `cfg(kani)`; the
    # `kani` gate checks them, and no unit test can reach them.
    "proofs::",
    # Sign restoration after magnitude rounding: `x <= 0` negates a zero
    # magnitude, which is still zero.
    "replace < with <= in round_shift_signed",
    # control-rs-ci: `>=` where equality of two instants or byte counts cannot
    # occur or changes nothing, `match guard ... with true` where the guarded
    # arm is a no-op for other inputs, and the `cfg(not(unix))` `terminate_tree`,
    # which is not compiled on the CI platform (`terminate_child_only`).
    "with true in strip_string_literals",
    "replace > with >= in Gate::spawn_and_log",
    "replace < with <= in drain_pumps",
    "replace terminate_child_only with \\(\\)",
    "replace > with >= in ReportAggregator::generate_markdown",
    # control-rs-compare: `>=` on a running maximum re-assigns an equal value,
    # the serial and parallel array comparisons return the same result on either
    # side of the chunk threshold, and the run-time limit only moves by one
    # clock tick.
    "replace > with >= in compute_chunk_stats",
    "replace < with <= in compare_float_arrays_parallel",
    "replace > with >= in execute_variant",
    # control-rs-ets-host: `>=` on two instants (a wall-clock comparison that
    # cannot tie) and `RunEnd::drained`, which already returns
    # `Default::default()`.
    "replace RunEnd::drained -> Self with Default::default\\(\\)",
    "replace > with >= in HeadlessRun<'t>::(drive|retry_discovery)",
    # control-rs-ets: `|` versus `^` joins two bytes with disjoint bits; a frame
    # buffer shorter than six bytes cannot hold a payload either way; the
    # Cortex-M and RISC-V profilers only compile for their own targets; and the
    # default FPU flags are zero on the host that runs the mutation test.
    "replace \\| with \\^ in FrameReader::handle_byte",
    "replace < with (==|<=) in FrameEncoder::serialize_then_frame",
    "<impl CPUProfiler for (CortexMProfiler|RiscvProfiler)>",
    "replace CPUProfiler::fpu_flags -> u8 with 0",
]
