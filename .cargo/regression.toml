# Latency budgets for the `regression` gate (`ci-design.md` §4.7).
#
# A key is a Criterion benchmark identifier, or a prefix when it ends in `*`.
# The exact key wins, then the longest prefix. A benchmark that matches no key
# fails the gate. Durations take `ns`, `us` (or `µs`), `ms` or `s`.

[budgets]
"jitter/state_space_step_response" = "10 us"
"jitter/ekf_8x8_covariance_update" = "10 us"
"jitter/hilbert_32x32_solve" = "100 us"
"jitter/*" = "50 us"
"state_space_scaling/zoh_dim/128*" = "100 ms"
"state_space_scaling/*" = "50 ms"
"matrix_inversion_scaling/*" = "10 ms"
"tensor_contraction_scaling/*" = "10 ms"
"polynomial_evaluation_scaling/*" = "1 ms"
