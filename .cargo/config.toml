[alias]

# Continuous Integration & Quality Gates
ci = ["run", "--package", "control-rs-ci", "--bin", "control-rs-ci", "--"]
gate = ["run", "--package", "control-rs-ci", "--bin", "gate", "--"]
report = ["run", "--package", "control-rs-ci", "--bin", "report", "--"]
compare = ["run", "--package", "control-rs-compare", "--bin", "compare", "--"]
valgrind = ["run", "--package", "control-rs-ci", "--bin", "valgrind", "--"]
regression = ["run", "--package", "control-rs-ci", "--bin", "regression", "--"]
ets = ["run", "--package", "control-rs-ci", "--bin", "ets", "--"]

# Interactive TUI
tui = ["run", "--package", "control-rs-tui", "--"]

# On-target ETS infrastructure and target execution aliases
qemu = ["tui", "qemu"]
teensy = ["tui", "teensy"]


# Format check helper
fmt-check = ["fmt", "--all", "--", "--check"]
fmt-all = ["fmt", "--all"]

# Clippy Helper
lint = ["gate", "lint"]
clippy-json = ["lint", "--message-format=json"]
clippy-ci = ["clippy-json", "--", "-D", "warnings"]

# Coverage helper
coverage = ["tarpaulin", "--config", ".cargo/tarpaulin.toml", "--verbose", "--workspace"]
coverage-ci = ["coverage", "--color", "never", "--out", "Html", "--out", "Json"]
[env]
# clippy.toml lives beside this file.
CLIPPY_CONF_DIR = { value = ".cargo", relative = true }